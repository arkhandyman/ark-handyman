backend:
  name: github
  repo: arkhandyman/ark-handyman
  branch: main
  base_url: https://www.arkhandymanpro.com
  auth_endpoint: api/oauth/authorize

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog Posts
    folder: content/blog
    create: true
    slug: "{{slug}}"
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Short Description, name: description, widget: text }
      - label: Category
        name: category
        widget: select
        options:
          - Home Maintenance
          - Drywall Tips
          - Painting Tips
          - Tile Tips
          - Local Community
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Image Alt Text, name: imageAlt, widget: string, required: false }
      - { label: Body, name: body, widget: markdown }
