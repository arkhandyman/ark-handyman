<style>
  /*
   * Deliberately single-theme: this is a game screen, not a document, and the
   * element palette only reads correctly against a dark ground. Every color is
   * declared on bare :root so the page holds on any host background.
   */
  :root {
    color-scheme: dark;
    --bg: #10141c; --panel: #1a2030; --panel2: #232b3d; --line: #2f3950;
    --ink: #e8edf7; --dim: #8f9ab4; --accent: #7fd4ff; --good: #6fcf7f;
    --bad: #f2704a; --gold: #f5d547;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif,
    system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 12px;
    min-height: 100vh;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  button:focus-visible, [data-act]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  #app { width: 100%; max-width: 460px; }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: .5px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--accent); text-transform: uppercase;

  .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
          padding: 14px; margin-bottom: 12px; }
  button {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;

  button:hover:not(:disabled) { border-color: var(--accent); background: #2b354a; }

  .mon { display: flex; align-items: center; gap: 10px; }
  .blob { width: 54px; height: 54px; border-radius: 42% 58% 55% 45% / 52% 45% 55% 48%;

<script>
/*
 * Infinimon — prototype rules engine
 *
 * Pure rules, no rendering, no dependencies. Runs in both Node and the browser
 * so the simulation harness and the playable prototype share one source of truth.
 *
 * Implements design-v1.md sections 2, 3, 5, 6, 7.
 * All names are placeholders — see naming.md.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Infinimon = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // Tuning constants (§5, §7)
  // ---------------------------------------------------------------------------

  // Mutable so the tuning harness can sweep them. Defaults are the values
  // design-v1.md currently specifies; tune.js is what justifies changing them.
  const CONFIG = {
    // Values chosen by tune.js, which swept 60 combinations and scored each on
    // fight length, taming feasibility, and element balance. K was 0.6 in the
    // original design, which produced 2-turn fights and made ~25% of wild
    // monsters impossible to tame.
    K: 0.30,                  // global damage constant — the primary tuning knob
    DEF_CONSTANT: 70,         // softens the ATK/DEF ratio
    LEVEL_TERM_DIVISOR: 40,   // damage level term: 1 + Level/40
    STAT_GROWTH_DIVISOR: 20,  // stat growth: base * (1 + Level/20)
    FOCUS_START: 3,           // starting Focus — affords one Strong move up front
    FOCUS_MAX: 6,
    FOCUS_REGEN: 1,

    /*
     * Player-experience knobs. The balance sims measure equal-level 1v1 with
     * both sides played optimally — which is NOT what a player faces. A real
     * player carries damage between fights, may be under-levelled, and is up
     * against an AI that never misplays. These close that gap.
     */
    WILD_AI_ACCURACY: 0.5,      // chance a wild picks its best move vs. a random one
    INCOMING_DAMAGE_MULT: 0.7,  // damage dealt TO the player's monsters
    POST_BATTLE_HEAL: 0.5,      // fraction of max HP restored after every encounter

    /*
     * A creature's patience. Letting a failed attunement keep the encounter
     * alive removed the feel-bad, but with banked Trust it also made taming
     * eventually guaranteed — 12 tames from 12 encounters, no stakes at all.
     * Each failure now risks it bolting, which caps retries at two or three
     * without ever wasting the Trust you earned.
     */
    FLEE_BASE: 0.28,            // flee chance after the first failed attempt
    FLEE_STEP: 0.22,            // added per subsequent failure

    /*
     * How much a point of SPD is worth in the power score.
     *
     * The score originally read HP x (DEF + C) x ATK and ignored SPD entirely —
     * correct when SPD only set turn order, and wrong once glancing blows and
     * Focus surge gave it teeth. Fitting hybrids against the SPD-blind formula
     * handed fast lines a full HP/ATK/DEF budget PLUS free speed, producing a
     * 71.9-point win-rate spread that tracked SPD almost perfectly.
     *
     * Swept empirically by `node hybrids.js sweep`.
     */
    SPD_POWER_WEIGHT: 0.010,
    SPD_POWER_PIVOT: 35,        // SPD considered "average", worth no adjustment

    // Scales type advantage toward neutral. 1 = the design's 1.5/0.75.
    TYPE_SCALE: 1.0,

    // SPD used to decide turn order and nothing else, which made it nearly
    // worthless — balance.js measured r = 0.987 between HP x (DEF+C) x ATK and
    // win rate, with fast monsters at the bottom. These give SPD real value.
    GLANCE_DIVISOR: 120,      // SPD lead needed per point of glance chance
    GLANCE_CAP: 0.40,         // max chance an incoming hit glances
    GLANCE_DAMAGE: 0.5,       // a glancing blow deals half damage
    FOCUS_SURGE_RATIO: 1.5,   // outspeed by this much and you regen Focus faster
  };

  function configure(patch) {
    Object.assign(CONFIG, patch);
  }

  const MAX_LEVEL = 25;
  const BOND_BONUS_THRESHOLD = 60;
  const BOND_BONUS = 1.05;
  const RARE_BLOOM_CHANCE = 0.05;
  const RARE_BLOOM_MULT = 1.10;

  // ---------------------------------------------------------------------------
  // Seedable RNG — simulations must be reproducible
  // ---------------------------------------------------------------------------

  function makeRng(seed) {
    let s = (seed >>> 0) || 1;
    return function rng() {
      // mulberry32
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
  const range = (rng, lo, hi) => lo + rng() * (hi - lo);

  // ---------------------------------------------------------------------------
  // Elements (§2)
  //
  // Cycle order. Each element is strong against the next two, weak against the
  // previous two, and neutral against its opposite (three steps away).
  // ---------------------------------------------------------------------------

  const ELEMENT_CYCLE = ['spark', 'tide', 'ember', 'verdant', 'terra', 'gale'];

  const ELEMENTS = {
    spark:   { name: 'Spark',   color: '#F5D547', dark: '#8A7410' },
    tide:    { name: 'Tide',    color: '#4EA8DE', dark: '#1B4F72' },
    ember:   { name: 'Ember',   color: '#F2704A', dark: '#8A2E12' },
    verdant: { name: 'Verdant', color: '#6FCF7F', dark: '#1E5B2A' },
    terra:   { name: 'Terra',   color: '#C89B6A', dark: '#6B4A24' },
    gale:    { name: 'Gale',    color: '#B9C7D6', dark: '#4A5A6B' },
  };

  const STRONG = 1.5;
  const NEUTRAL = 1.0;
  const WEAK = 0.75;

  /**
   * Multiplier for a single attacking element into a single defending element.
   *
   * CONFIG.TYPE_SCALE interpolates toward neutral: 1 gives the design's
   * 1.5 / 1.0 / 0.75, 0.7 gives 1.35 / 1.0 / 0.825, and 0 flattens the grid
   * entirely. This is the lever for the open question of whether type advantage
   * is too decisive, and it doubles as a diagnostic — running a round robin at
   * 0 isolates how much of a win-rate spread is stat lines versus matchups.
   */
  function typeMultiplier(attackEl, defendEl) {
    const i = ELEMENT_CYCLE.indexOf(attackEl);
    const j = ELEMENT_CYCLE.indexOf(defendEl);
    if (i < 0 || j < 0) return NEUTRAL;
    const delta = (j - i + 6) % 6;
    let raw = NEUTRAL;
    if (delta === 1 || delta === 2) raw = STRONG;      // beats the next two
    else if (delta === 4 || delta === 5) raw = WEAK;   // loses to the previous two
    return 1 + (raw - 1) * CONFIG.TYPE_SCALE;
  }

  /**
   * Defensive multiplier. Hybrids average their two elements, which is what
   * makes them resilient rather than immune (§2).
   */
  function defenseMultiplier(attackEl, defenderElements) {
    const mults = defenderElements.map((e) => typeMultiplier(attackEl, e));
    const avg = mults.reduce((a, b) => a + b, 0) / mults.length;
    return Math.round(avg * 100) / 100;
  }

  /** The element three steps away — it beats both of your weaknesses (§ coverage). */
  function oppositeElement(el) {
    return ELEMENT_CYCLE[(ELEMENT_CYCLE.indexOf(el) + 3) % 6];
  }

  // ---------------------------------------------------------------------------
  // Hybrid elements (§2) — 15 pairings
  // ---------------------------------------------------------------------------

  const HYBRID_NAMES = {
    'spark|tide': 'Current',
    'ember|spark': 'Plasma',
    'spark|verdant': 'Lumen',
    'spark|terra': 'Magnet',
    'gale|spark': 'Storm',
    'ember|tide': 'Steam',
    'tide|verdant': 'Marsh',
    'terra|tide': 'Clay',
    'gale|tide': 'Mist',
    'ember|verdant': 'Ash',
    'ember|terra': 'Magma',
    'ember|gale': 'Cinder',
    'terra|verdant': 'Grove',
    'gale|verdant': 'Spore',
    'gale|terra': 'Dust',
  };

  const hybridKey = (a, b) => [a, b].sort().join('|');
  const hybridName = (a, b) => HYBRID_NAMES[hybridKey(a, b)] || null;

  /**
   * Canonical element order for a hybrid: primary is whichever comes first in
   * the cycle. Without this the same pairing yields a different primary element
   * depending on which parent was selected first — same species name, different
   * move set. Species must be deterministic.
   */
  function orderElements(a, b) {
    const ia = ELEMENT_CYCLE.indexOf(a);
    const ib = ELEMENT_CYCLE.indexOf(b);
    return ia <= ib ? [a, b] : [b, a];
  }

  // ---------------------------------------------------------------------------
  // Hybrid species identity (§6)
  //
  // Averaging two parents produces a creature with no character of its own — a
  // Steam looked and played like "the mean of a Wickle and a Puddlup". Each
  // hybrid element now carries a stat BIAS, so every Steam is recognizably
  // steam-like (fast, vaporous, fragile) regardless of which Ember and which
  // Tide made it, while parent stats still drive individual variation.
  //
  // The bias REDISTRIBUTES rather than adds. After applying it, HP/ATK/DEF are
  // rescaled so the line's power score matches its target — otherwise a bias
  // toward HP and DEF would simply make that hybrid stronger, which is the exact
  // trap the 180-point stat budget fell into (see §7).
  //
  // Names are placeholders. See naming.md.
  // ---------------------------------------------------------------------------

  const HYBRID_PROFILES = {
    Current:   { name: 'Voltfin',    powerMult: 1.04, bias: { hp: 0.90, atk: 1.14, def: 0.86, spd: 1.20 },
                 personality: 'Restless, never settles in one place',
                 look: 'Eel-bodied, fins trailing arcs of charge through water' },
    Plasma:    { name: 'Arcflare',   powerMult: 0.97, bias: { hp: 0.82, atk: 1.34, def: 0.74, spd: 1.16 },
                 personality: 'Volatile, burns bright and brief',
                 look: 'A barely-contained silhouette of white-hot gas' },
    Lumen:     { name: 'Glimmoss',   powerMult: 0.93, bias: { hp: 1.16, atk: 0.84, def: 1.14, spd: 0.92 },
                 personality: 'Gentle, glows brighter around people it trusts',
                 look: 'Soft mossy shell lit from within, bioluminescent spots' },
    Magnet:    { name: 'Lodefang',   powerMult: 0.98, bias: { hp: 1.10, atk: 0.96, def: 1.30, spd: 0.70 },
                 personality: 'Immovable, collects metal debris on its hide',
                 look: 'Ore-plated quadruped, iron filings bristling along its back' },
    Storm:     { name: 'Squallwing', powerMult: 0.88, bias: { hp: 0.86, atk: 1.20, def: 0.82, spd: 1.32 },
                 personality: 'Dramatic, arrives before you hear it',
                 look: 'Broad stormcloud wings, lightning threading the feathers' },
    Steam:     { name: 'Kettlepup',  powerMult: 1.09, bias: { hp: 0.94, atk: 1.06, def: 0.86, spd: 1.26 },
                 personality: 'Excitable, whistles when it is happy',
                 look: 'Round pup wreathed in vapour, ears venting little jets' },
    Marsh:     { name: 'Bogbloom',   powerMult: 1.05, bias: { hp: 1.28, atk: 0.94, def: 1.14, spd: 0.70 },
                 personality: 'Patient to the point of seeming asleep',
                 look: 'Low wide amphibian, reed flowers growing from its back' },
    Clay:      { name: 'Siltshell',  powerMult: 1.00, bias: { hp: 1.18, atk: 0.88, def: 1.26, spd: 0.76 },
                 personality: 'Steady, reshapes itself when it is nervous',
                 look: 'Wet clay carapace, cracked and re-smoothed over and over' },
    Mist:      { name: 'Hazewisp',   powerMult: 0.84, bias: { hp: 0.86, atk: 0.88, def: 1.02, spd: 1.36 },
                 personality: 'Elusive, is rarely where you last looked',
                 look: 'Half-there drifting form with faint eyes and no edges' },
    Ash:       { name: 'Sootleaf',   powerMult: 1.19, bias: { hp: 1.14, atk: 1.10, def: 0.96, spd: 0.84 },
                 personality: 'Smoulders quietly, holds a grudge',
                 look: 'Charred leaf-plated creature trailing warm grey flakes' },
    Magma:     { name: 'Cragmelt',   powerMult: 1.10, bias: { hp: 1.16, atk: 1.30, def: 1.02, spd: 0.62 },
                 personality: 'Slow, heavy, and absolutely certain',
                 look: 'Stone shell split by molten seams that brighten when angry' },
    Cinder:    { name: 'Emberkite',  powerMult: 0.89, bias: { hp: 0.84, atk: 1.22, def: 0.80, spd: 1.28 },
                 personality: 'Playful, leaves scorch marks everywhere',
                 look: 'Paper-thin glider trailing a wake of live sparks' },
    Grove:     { name: 'Barkroot',   powerMult: 1.15, bias: { hp: 1.34, atk: 0.92, def: 1.28, spd: 0.60 },
                 personality: 'Ancient-feeling even when young',
                 look: 'Deep-rooted bark body, stone caught up in the root mass' },
    Spore:     { name: 'Puffcap',    powerMult: 0.89, bias: { hp: 1.12, atk: 0.84, def: 0.98, spd: 1.22 },
                 personality: 'Drifts wherever the wind decides',
                 look: 'Cap-headed drifter shedding a slow trail of spores' },
    Dust:      { name: 'Grithare',   powerMult: 0.96, bias: { hp: 0.94, atk: 0.96, def: 1.14, spd: 1.20 },
                 personality: 'Skittish, kicks up cover and vanishes into it',
                 look: 'Long-eared runner wrapped in a haze of grit' },
  };

  // ---------------------------------------------------------------------------
  // Base roster (§3) — every base monster totals exactly 180
  // ---------------------------------------------------------------------------

  /*
   * Stat lines solved by autobalance.js, not hand-assigned.
   *
   * The design originally gave every base monster a 180-point total for "trivial
   * fairness". Simulation disproved that: stat points are not fungible, so equal
   * budgets produced a 92-point win-rate spread (Coalpaw 99.7%, Kitewing 7.7%).
   * These lines equalize measured win rate instead, landing at a 6.4-point
   * spread. Totals now range 170-191 — fast, frail monsters need a slightly
   * larger budget because SPD buys less than HP and DEF do.
   */
  /*
   * Three creatures per element, each with a distinct body ARCHETYPE.
   *
   * The archetype is what makes blending mean something: a fire fox bred with a
   * fire lizard produces a fire creature carrying the fox's head and markings on
   * the lizard's frame. Element decides the palette; the two archetypes decide
   * the silhouette. Without this field, "they combine" has nothing to combine.
   *
   * Stat lines are solved by autobalance.js, never hand-assigned — see §7.
   */
  const SPECIES = [
    // Spark — moth, ram, serpent
    { id: 'voltmoth', name: 'Voltmoth', element: 'spark',   archetype: 'moth',     hp: 36, atk: 56, def: 25, spd: 65, rarity: 'common',   look: 'Pale moth, lightning veins in its wings' },
    { id: 'bolthorn', name: 'Bolthorn', element: 'spark',   archetype: 'ram',      hp: 54, atk: 49, def: 43, spd: 30, rarity: 'uncommon', look: 'Stocky ram, charge arcing between horns' },
    { id: 'snapcoil', name: 'Snapcoil', element: 'spark',   archetype: 'serpent',  hp: 39, atk: 54, def: 29, spd: 55, rarity: 'common',   look: 'Ribbon-thin serpent that snaps like a live wire' },
    // Tide — blob, otter, crab
    { id: 'puddlup',  name: 'Puddlup',  element: 'tide',    archetype: 'blob',     hp: 61, atk: 35, def: 56, spd: 30, rarity: 'common',   look: 'Round puddle-creature, oversized eyes' },
    { id: 'finwhisk', name: 'Finwhisk', element: 'tide',    archetype: 'otter',    hp: 40, atk: 50, def: 30, spd: 60, rarity: 'common',   look: 'Darting fish-otter with whisker fins' },
    { id: 'brineclaw',name: 'Brineclaw',element: 'tide',    archetype: 'crab',     hp: 50, atk: 45, def: 59, spd: 25, rarity: 'uncommon', look: 'Barnacled crab with one oversized claw' },
    // Ember — fox, badger, lizard
    { id: 'wickle',   name: 'Wickle',   element: 'ember',   archetype: 'fox',      hp: 36, atk: 60, def: 25, spd: 60, rarity: 'common',   look: 'Fox kit with a candle-flame tail' },
    { id: 'coalpaw',  name: 'Coalpaw',  element: 'ember',   archetype: 'badger',   hp: 52, atk: 56, def: 42, spd: 20, rarity: 'rare',     look: 'Heavy badger, glowing cracks in its hide' },
    { id: 'scorchtail',name:'Scorchtail',element:'ember',   archetype: 'lizard',   hp: 44, atk: 54, def: 39, spd: 40, rarity: 'common',   look: 'Sun-basking lizard whose tail burns like a wick' },
    // Verdant — sapling, rodent, deer
    { id: 'sproutle', name: 'Sproutle', element: 'verdant', archetype: 'sapling',  hp: 56, atk: 41, def: 56, spd: 30, rarity: 'common',   look: 'Sapling creature with leaf-bud ears' },
    { id: 'thornip',  name: 'Thornip',  element: 'verdant', archetype: 'rodent',   hp: 39, atk: 60, def: 30, spd: 50, rarity: 'common',   look: 'Bristly root-rodent, thorn ridge' },
    { id: 'fernfawn', name: 'Fernfawn', element: 'verdant', archetype: 'deer',     hp: 45, atk: 45, def: 35, spd: 55, rarity: 'uncommon', look: 'Slender fawn with fern fronds for a tail' },
    // Terra — tortoise, owl, beetle
    { id: 'pebbet',   name: 'Pebbet',   element: 'terra',   archetype: 'tortoise', hp: 61, atk: 41, def: 66, spd: 15, rarity: 'uncommon', look: 'Small stone tortoise, moss on the shell' },
    { id: 'burrowl',  name: 'Burrowl',  element: 'terra',   archetype: 'owl',      hp: 45, atk: 50, def: 40, spd: 45, rarity: 'uncommon', look: 'Owl with earth feathers and digging talons' },
    { id: 'shalebug', name: 'Shalebug', element: 'terra',   archetype: 'beetle',   hp: 50, atk: 45, def: 55, spd: 30, rarity: 'common',   look: 'Beetle plated in flat shale, dusty underneath' },
    // Gale — manta, bird, weasel
    { id: 'kitewing', name: 'Kitewing', element: 'gale',    archetype: 'manta',    hp: 33, atk: 50, def: 33, spd: 75, rarity: 'rare',     look: 'Paper-thin gliding manta, translucent' },
    { id: 'ruffle',   name: 'Ruffle',   element: 'gale',    archetype: 'bird',     hp: 48, atk: 48, def: 39, spd: 40, rarity: 'common',   look: 'Puffed-up bird, permanently windswept' },
    { id: 'breezel',  name: 'Breezel',  element: 'gale',    archetype: 'weasel',   hp: 40, atk: 50, def: 35, spd: 55, rarity: 'common',   look: 'Long weasel that runs just ahead of the wind' },
  ];

  /*
   * Same-element blends — the everyday breeding result (§6).
   *
   * One per pair of archetypes within an element: 3 pairs x 6 elements = 18.
   * Keyed by the two parent species ids, sorted, so a pairing is deterministic
   * in either order. Names are placeholders; see naming.md.
   */
  const BLENDS = {
    // Spark
    'bolthorn|voltmoth':  { name: 'Voltram',      look: 'Ram\'s curled horns on a moth\'s furred, winged body' },
    'snapcoil|voltmoth':  { name: 'Coilmoth',     look: 'Serpentine body trailing four ragged moth wings' },
    'bolthorn|snapcoil':  { name: 'Hornsnap',     look: 'Horned serpent that rears and butts like a ram' },
    // Tide
    'finwhisk|puddlup':   { name: 'Whiskpool',    look: 'Otter shape that keeps half-melting back into water' },
    'brineclaw|puddlup':  { name: 'Poolclaw',     look: 'Soft puddle body with one heavy barnacled claw' },
    'brineclaw|finwhisk': { name: 'Clawfin',      look: 'Sleek otter with crab plating along its back' },
    // Ember
    'scorchtail|wickle':  { name: 'Scorchkit',    look: 'Fox\'s ears and brush tail on a lean lizard frame' },
    'coalpaw|wickle':     { name: 'Coalkit',      look: 'Fox-faced, badger-built, cracks glowing at the joints' },
    'coalpaw|scorchtail': { name: 'Cindermaw',    look: 'Broad badger jaw on a low, scaled, ember-lit body' },
    // Verdant
    'sproutle|thornip':   { name: 'Thornsprout',  look: 'Rodent curled inside a sapling\'s split trunk' },
    'fernfawn|sproutle':  { name: 'Leaffawn',     look: 'Fawn with a sapling\'s bud-crown and bark-flecked legs' },
    'fernfawn|thornip':   { name: 'Bramblefawn',  look: 'Fawn wearing a bristling thorn mantle' },
    // Terra
    'burrowl|pebbet':     { name: 'Shellowl',     look: 'Owl hunched under a mossy tortoise shell' },
    'pebbet|shalebug':    { name: 'Cragshell',    look: 'Tortoise shell layered in overlapping shale plates' },
    'burrowl|shalebug':   { name: 'Beetlebeak',   look: 'Beetle carapace split by a hooked owl\'s beak' },
    // Gale
    'kitewing|ruffle':    { name: 'Kiteplume',    look: 'Translucent glider edged in soft feather down' },
    'breezel|kitewing':   { name: 'Glidetail',    look: 'Long weasel with a manta\'s membrane between its limbs' },
    'breezel|ruffle':     { name: 'Windruff',     look: 'Feather-ruffed weasel, permanently mid-gust' },
  };

  const blendKey = (idA, idB) => [idA, idB].sort().join('|');
  const blendFor = (idA, idB) => BLENDS[blendKey(idA, idB)] || null;

  const speciesById = (id) => SPECIES.find((s) => s.id === id);

  /*
   * Trust thresholds. Originally 3/4/5 against a maximum of 3 taps, which meant
   * even a Common demanded a perfect run and anything rarer was gated behind
   * consumables. Playtesting confirmed this read as punishing. Lowered so a
   * Common needs 2 of 3 taps and the rarer tiers are reachable without a
   * flawless performance.
   */
  const TRUST_REQUIRED = { common: 2, uncommon: 3, rare: 4 };
  const SPAWN_WEIGHT = { common: 10, uncommon: 4, rare: 1 };

  // ---------------------------------------------------------------------------
  // Moves (§5)
  //
  // Placeholder pools. Real move design is still an open question — every
  // monster currently gets Basic / Standard / Strong in its own element plus a
  // Standard coverage move in the opposite element, which by construction
  // answers both of its weaknesses.
  // ---------------------------------------------------------------------------

  const TIERS = {
    basic:    { power: 25, focus: 0 },
    standard: { power: 40, focus: 1 },
    strong:   { power: 65, focus: 3 },
  };

  const MOVE_NAMES = {
    spark:   { basic: 'Jolt',        standard: 'Arc Lash',   strong: 'Thunderhead' },
    tide:    { basic: 'Splash',      standard: 'Undertow',   strong: 'Riptide' },
    ember:   { basic: 'Cinder Flick', standard: 'Flame Lash', strong: 'Firestorm' },
    verdant: { basic: 'Vine Tap',    standard: 'Bramble',    strong: 'Overgrowth' },
    terra:   { basic: 'Pebble Toss', standard: 'Stone Slam', strong: 'Landslide' },
    gale:    { basic: 'Gust',        standard: 'Crosswind',  strong: 'Cyclone' },
  };

  const STATUS_BY_ELEMENT = {
    ember: 'scorched', spark: 'scorched',
    tide: 'drenched', gale: 'drenched',
    verdant: 'rooted', terra: 'rooted',
  };

  const STATUSES = {
    scorched: { name: 'Scorched', turns: 3, tick: 0.05 },
    drenched: { name: 'Drenched', turns: 3, spdMult: 0.5 },
    rooted:   { name: 'Rooted',   turns: 2, noSwitch: true },
  };

  function makeMove(element, tier) {
    return {
      name: MOVE_NAMES[element][tier],
      element,
      tier,
      power: TIERS[tier].power,
      focus: TIERS[tier].focus,
      // Strong moves carry a chance to inflict their element's status.
      status: tier === 'strong' ? STATUS_BY_ELEMENT[element] : null,
      statusChance: tier === 'strong' ? 0.25 : 0,
    };
  }

  function movesFor(elements) {
    const primary = elements[0];
    const secondary = elements[1] || oppositeElement(primary);
    return [
      makeMove(primary, 'basic'),
      makeMove(primary, 'standard'),
      makeMove(primary, 'strong'),
      makeMove(secondary, 'standard'), // coverage
    ];
  }

  // ---------------------------------------------------------------------------
  // Monsters (§7)
  // ---------------------------------------------------------------------------

  let nextUid = 1;

  /** Proportional growth — preserves each monster's stat *shape* at every level. */
  function statAt(base, level, mult) {
    return Math.round(base * (1 + level / CONFIG.STAT_GROWTH_DIVISOR) * (mult || 1));
  }

  function createMonster(opts) {
    const {
      speciesId, level = 5, bases, elements, name,
      bond = 30, rareBloom = false, bred = false,
    } = opts;

    const sp = speciesId ? speciesById(speciesId) : null;
    const els = elements || [sp.element];
    const b = bases || { hp: sp.hp, atk: sp.atk, def: sp.def, spd: sp.spd };
    const mult = rareBloom ? RARE_BLOOM_MULT : 1;

    const m = {
      uid: nextUid++,
      speciesId: speciesId || null,
      name: name || sp.name,
      elements: els,
      elementLabel: els.length > 1 ? hybridName(els[0], els[1]) : ELEMENTS[els[0]].name,
      rarity: sp ? sp.rarity : 'bred',
      level,
      bases: b,
      rareBloom,
      bred,
      bond,
      xp: 0,
      status: null,
      statusTurns: 0,
      moves: movesFor(els),
    };
    m.maxHp = statAt(b.hp, level, mult);
    m.hp = m.maxHp;
    m.atk = statAt(b.atk, level, mult);
    m.def = statAt(b.def, level, mult);
    m.spd = statAt(b.spd, level, mult);
    return m;
  }

  // ---------------------------------------------------------------------------
  // Leveling (§7)
  // ---------------------------------------------------------------------------

  const xpToNext = (level) => Math.round(15 * Math.pow(level, 1.5));

  function recomputeStats(m) {
    const mult = m.rareBloom ? RARE_BLOOM_MULT : 1;
    const frac = m.maxHp ? m.hp / m.maxHp : 1;
    m.maxHp = statAt(m.bases.hp, m.level, mult);
    m.atk = statAt(m.bases.atk, m.level, mult);
    m.def = statAt(m.bases.def, m.level, mult);
    m.spd = statAt(m.bases.spd, m.level, mult);
    m.hp = Math.max(1, Math.round(m.maxHp * frac)); // keep the same HP fraction
  }

  /** Award XP, leveling up as many times as the amount covers. */
  function grantXp(m, amount) {
    if (m.level >= MAX_LEVEL) return { levels: 0 };
    m.xp = (m.xp || 0) + amount;
    let levels = 0;
    while (m.level < MAX_LEVEL && m.xp >= xpToNext(m.level)) {
      m.xp -= xpToNext(m.level);
      m.level += 1;
      levels += 1;
    }
    if (levels) recomputeStats(m);
    return { levels };
  }

  /** XP for beating a wild, scaled by the level gap — punching up pays better. */
  function xpForWin(winnerLevel, loserLevel) {
    const gap = loserLevel - winnerLevel;
    return Math.max(12, Math.round((18 + loserLevel * 4) * (1 + gap * 0.15)));
  }

  const effectiveSpd = (m) =>
    m.status === 'drenched' ? Math.round(m.spd * STATUSES.drenched.spdMult) : m.spd;

  const bondBonusOf = (m) => (m.bond >= BOND_BONUS_THRESHOLD ? BOND_BONUS : 1.0);

  // ---------------------------------------------------------------------------
  // Damage (§5)
  // ---------------------------------------------------------------------------

  function damage(attacker, defender, move, rng, opts) {
    const mult = defenseMultiplier(move.element, defender.elements);
    const levelTerm = 1 + attacker.level / CONFIG.LEVEL_TERM_DIVISOR;
    const variance = opts && opts.noVariance ? 1 : range(rng, 0.9, 1.1);
    const raw =
      move.power *
      (attacker.atk / (defender.def + CONFIG.DEF_CONSTANT)) *
      levelTerm *
      mult *
      bondBonusOf(attacker) *
      CONFIG.K *
      variance;
    return { amount: Math.max(1, Math.round(raw)), multiplier: mult };
  }

  /** Expected damage with variance removed — used by the AI and the UI preview. */
  const expectedDamage = (a, d, mv) => damage(a, d, mv, null, { noVariance: true }).amount;

  // ---------------------------------------------------------------------------
  // Battle (§5)
  // ---------------------------------------------------------------------------

  function createBattle(playerTeam, wild, rng) {
    return {
      rng,
      team: playerTeam,
      activeIndex: 0,
      wild,
      playerFocus: CONFIG.FOCUS_START,
      wildFocus: CONFIG.FOCUS_START,
      turn: 1,
      log: [],
      over: false,
      outcome: null,
      // Highest HP fraction the wild monster has been seen below — drives the
      // taming window measurement.
      wildLowWater: 1,
    };
  }

  const activeMonster = (b) => b.team[b.activeIndex];

  function affordable(monster, focus) {
    return monster.moves.filter((mv) => mv.focus <= focus);
  }

  /** Baseline "competent player" AI: highest expected damage it can afford. */
  function chooseMove(attacker, defender, focus) {
    const options = affordable(attacker, focus);
    let best = options[0];
    let bestVal = -1;
    for (const mv of options) {
      const val = expectedDamage(attacker, defender, mv);
      if (val > bestVal) { bestVal = val; best = mv; }
    }
    return best;
  }

  /**
   * Wild creatures are not tacticians. They play the optimal move only
   * WILD_AI_ACCURACY of the time and otherwise pick at random from what they can
   * afford. An opponent that never misplays is the single biggest reason a
   * fight feels harder than the balance numbers suggest.
   */
  function chooseWildMove(attacker, defender, focus, rng) {
    const options = affordable(attacker, focus);
    if (!rng || rng() < CONFIG.WILD_AI_ACCURACY) {
      return chooseMove(attacker, defender, focus);
    }
    return options[Math.floor(rng() * options.length)];
  }

  function applyStatusTick(m, b) {
    if (!m.status) return;
    const s = STATUSES[m.status];
    if (s.tick) {
      const dmg = Math.max(1, Math.round(m.maxHp * s.tick));
      m.hp = Math.max(0, m.hp - dmg);
      b.log.push(`${m.name} takes ${dmg} from ${s.name}.`);
    }
    m.statusTurns -= 1;
    if (m.statusTurns <= 0) {
      b.log.push(`${m.name} is no longer ${STATUSES[m.status].name}.`);
      m.status = null;
    }
  }

  /**
   * Chance an incoming hit glances off a faster defender. This is damage
   * reduction rather than a miss — random whiffs feel bad, and a partial hit
   * reads as the defender being quick rather than the attacker being unlucky.
   */
  function glanceChance(attacker, defender) {
    const lead = effectiveSpd(defender) - effectiveSpd(attacker);
    if (lead <= 0) return 0;
    return Math.min(CONFIG.GLANCE_CAP, lead / CONFIG.GLANCE_DIVISOR);
  }

  function strike(attacker, defender, move, b, damageMult) {
    let { amount, multiplier } = damage(attacker, defender, move, b.rng);

    if (damageMult && damageMult !== 1) amount = Math.max(1, Math.round(amount * damageMult));

    const glanced = b.rng() < glanceChance(attacker, defender);
    if (glanced) amount = Math.max(1, Math.round(amount * CONFIG.GLANCE_DAMAGE));

    defender.hp = Math.max(0, defender.hp - amount);
    const tag = glanced ? ` ${defender.name} slips most of it!`
      : multiplier > 1.05 ? ' It hits hard!'
      : multiplier < 0.95 ? " It's not very effective." : '';
    b.log.push(`${attacker.name} used ${move.name} — ${amount} damage.${tag}`);

    if (move.status && b.rng() < move.statusChance && !defender.status) {
      defender.status = move.status;
      defender.statusTurns = STATUSES[move.status].turns;
      b.log.push(`${defender.name} is ${STATUSES[move.status].name}!`);
    }
    return amount;
  }

  /**
   * Resolve one full turn. `playerMove` may be null when the player switched or
   * attuned, in which case only the wild monster acts.
   */
  function resolveTurn(b, playerMove) {
    if (b.over) return b;
    const player = activeMonster(b);
    const wild = b.wild;

    if (playerMove) b.playerFocus -= playerMove.focus;
    const wildMove = chooseWildMove(wild, player, b.wildFocus, b.rng);
    b.wildFocus -= wildMove.focus;

    // Turn order by SPD; ties resolve on a visible coin flip (§5).
    let playerFirst;
    const ps = effectiveSpd(player);
    const ws = effectiveSpd(wild);
    if (ps !== ws) playerFirst = ps > ws;
    else {
      playerFirst = b.rng() < 0.5;
      b.log.push(`Speed tie — coin flip: ${playerFirst ? 'you' : wild.name} go first.`);
    }

    const order = playerFirst
      ? [[player, wild, playerMove], [wild, player, wildMove]]
      : [[wild, player, wildMove], [player, wild, playerMove]];

    for (const [atk, def, mv] of order) {
      if (b.over || atk.hp <= 0 || !mv) continue;
      // The player's monsters take reduced damage — see CONFIG.
      strike(atk, def, mv, b, atk === wild ? CONFIG.INCOMING_DAMAGE_MULT : 1);
      b.wildLowWater = Math.min(b.wildLowWater, wild.hp / wild.maxHp);
      if (def.hp <= 0) {
        b.log.push(`${def.name} fainted.`);
        if (def === wild) finish(b, 'wild_fainted');
        else if (!switchToNextAlive(b)) finish(b, 'player_wiped');
      }
    }

    if (!b.over) {
      applyStatusTick(player, b);
      applyStatusTick(wild, b);
      b.wildLowWater = Math.min(b.wildLowWater, wild.hp / wild.maxHp);
      if (wild.hp <= 0) finish(b, 'wild_fainted');
      else if (activeMonster(b).hp <= 0 && !switchToNextAlive(b)) finish(b, 'player_wiped');
    }

    if (!b.over) {
      b.turn += 1;
      // Outspeeding by a wide margin regenerates Focus faster, so SPD feeds the
      // action economy instead of only deciding who swings first.
      const cur = activeMonster(b);
      const pSpd = effectiveSpd(cur);
      const wSpd = effectiveSpd(wild);
      const pRegen = CONFIG.FOCUS_REGEN + (pSpd >= wSpd * CONFIG.FOCUS_SURGE_RATIO ? 1 : 0);
      const wRegen = CONFIG.FOCUS_REGEN + (wSpd >= pSpd * CONFIG.FOCUS_SURGE_RATIO ? 1 : 0);
      b.playerFocus = Math.min(CONFIG.FOCUS_MAX, b.playerFocus + pRegen);
      b.wildFocus = Math.min(CONFIG.FOCUS_MAX, b.wildFocus + wRegen);
    }
    return b;
  }

  function switchToNextAlive(b) {
    const i = b.team.findIndex((m) => m.hp > 0);
    if (i < 0) return false;
    b.activeIndex = i;
    return true;
  }

  function finish(b, outcome) {
    b.over = true;
    b.outcome = outcome;
  }

  // ---------------------------------------------------------------------------
  // Taming (§4)
  // ---------------------------------------------------------------------------

  const canAttune = (wild) => wild.hp > 0 && wild.hp / wild.maxHp < 0.5;

  /*
   * Attunement difficulty.
   *
   * The first version swept a needle continuously AND repositioned the target
   * zone between every tap, demanding three hits under time pressure. That is
   * two difficulty sources stacked, and playtesting found it simply too hard.
   *
   * The zone now stays put for the whole attempt, starts far wider, and grows
   * as the creature calms — while the needle slows down with each tap landed.
   * Both curves run in the player's favour, and both are thematic: the creature
   * is settling, so it gets easier to read.
   */
  const ATTUNE = {
    BASE_ZONE: 34,        // percent of the track, up from 21
    CRYSTAL_ZONE_BONUS: 12,
    LOW_HP_ZONE_BONUS: 10, // a hurt creature is calmer and easier to read
    PER_TAP_ZONE_BONUS: 6, // each landed tap settles it further
    BASE_SPEED: 0.62,      // down from 0.90
    PER_TAP_SLOWDOWN: 0.16,
    RARITY_SPEED: { common: 0, uncommon: 0.12, rare: 0.24 },
  };

  /** Width of the green zone, as a percentage of the track. */
  function attuneZoneWidth(wild, { crystalMatch, tapsLanded = 0 }) {
    let w = ATTUNE.BASE_ZONE;
    if (crystalMatch) w += ATTUNE.CRYSTAL_ZONE_BONUS;
    if (wild.hp / wild.maxHp < 0.25) w += ATTUNE.LOW_HP_ZONE_BONUS;
    w += tapsLanded * ATTUNE.PER_TAP_ZONE_BONUS;
    return Math.min(72, w);
  }

  /** Needle sweep speed — slows as the creature settles. */
  function attuneSpeed(wild, tapsLanded = 0) {
    const base = ATTUNE.BASE_SPEED + (ATTUNE.RARITY_SPEED[wild.rarity] || 0);
    return Math.max(0.25, base - tapsLanded * ATTUNE.PER_TAP_SLOWDOWN);
  }

  /**
   * Chance the creature bolts after a failed attunement. `fails` counts the
   * failures so far in THIS encounter, including the one just scored.
   */
  function fleeChanceAfterFailure(fails) {
    return Math.min(0.9, CONFIG.FLEE_BASE + (fails - 1) * CONFIG.FLEE_STEP);
  }

  /**
   * Score an attunement attempt.
   *   taps          — number of taps that landed in the green zone (0-3)
   *   crystalMatch  — a matching-element Resonance Crystal was offered
   *   banked        — Trust carried from previous failed attempts (caps at 3)
   */
  function attune(wild, { taps, crystalMatch, banked = 0 }) {
    const required = TRUST_REQUIRED[wild.rarity] || 2;
    let trust = taps;
    if (crystalMatch) trust += 1;
    if (wild.hp / wild.maxHp < 0.25) trust += 1;
    trust += banked;

    const success = trust >= required;
    return {
      success,
      trust,
      required,
      // Failure banks progress. This now accrues WITHIN a single encounter as
      // well as across encounters, so retrying in the same fight gets easier.
      newBanked: success ? 0 : Math.min(3, banked + 1),
    };
  }

  // ---------------------------------------------------------------------------
  // Breeding (§6)
  // ---------------------------------------------------------------------------

  const STAT_KEYS = ['hp', 'atk', 'def', 'spd'];

  /**
   * Damage a line can deal before it dies — the yardstick from §7, now with a
   * SPD term. Survivability is HP x (DEF + C); output is ATK; and SPD multiplies
   * both through glancing blows and Focus surge (§5).
   */
  function powerOf(bases) {
    const spdFactor = Math.max(0.4,
      1 + ((bases.spd || CONFIG.SPD_POWER_PIVOT) - CONFIG.SPD_POWER_PIVOT) * CONFIG.SPD_POWER_WEIGHT);
    return bases.hp * (bases.def + CONFIG.DEF_CONSTANT) * bases.atk * spdFactor;
  }

  /**
   * Apply a hybrid's stat bias, then rescale HP/ATK/DEF so the line hits
   * `targetPower`. SPD is exempt from the rescale — it is the character axis,
   * and letting it ride free is what lets a Hazewisp be genuinely fast rather
   * than merely fast-for-its-budget.
   *
   * Solved by bisection because power is cubic-ish in the scale factor.
   */
  function fitToPower(bases, bias, targetPower) {
    const biased = {
      hp: bases.hp * bias.hp,
      atk: bases.atk * bias.atk,
      def: bases.def * bias.def,
      spd: bases.spd * bias.spd,
    };

    // The fit must account for the hybrid's own SPD, so a fast line is granted
    // correspondingly less HP/ATK/DEF rather than getting speed for free.
    let lo = 0.25, hi = 4.0;
    for (let i = 0; i < 40; i++) {
      const f = (lo + hi) / 2;
      const p = powerOf({
        hp: biased.hp * f, atk: biased.atk * f, def: biased.def * f, spd: biased.spd,
      });
      if (p < targetPower) lo = f; else hi = f;
    }
    const f = (lo + hi) / 2;

    return {
      hp: Math.max(15, Math.round(biased.hp * f)),
      atk: Math.max(15, Math.round(biased.atk * f)),
      def: Math.max(15, Math.round(biased.def * f)),
      spd: Math.max(10, Math.round(biased.spd)),
    };
  }

  // Breeding should be worth doing. Offspring target this multiple of the
  // parents' average power.
  const HYBRID_POWER_BONUS = 1.10;
  const BLEND_POWER_BONUS = 1.09;
  const REFINED_POWER_BONUS = 1.06;

  /*
   * Charge needed to hatch, by outcome. This is what makes "some hatch earlier
   * than others" true: a blend is quick, a cross-element hybrid takes roughly
   * three times as long. Rarity and patience reinforce each other.
   */
  const HATCH_CHARGE = {
    refined: 40,    // same species paired with itself
    blend: 65,      // same element, different archetypes — the everyday result
    throwback: 65,  // cross-element that failed to fuse
    hybrid: 190,    // the rare one
  };

  // Chance a cross-element pairing actually fuses. Cross-element hybrids are
  // meant to be a discovery, not a menu selection.
  const HYBRID_SUCCESS_CHANCE = 0.10;

  /**
   * Breed two creatures. Returns an EGG — the result is decided now but stays
   * hidden until the egg hatches (§6).
   *
   *   same species          -> refined line
   *   same element, differing archetypes -> BLEND (the everyday case)
   *   different elements    -> 10% true hybrid, otherwise a throwback to one
   *                            parent's species
   */
  function breed(a, b, rng) {
    const elsA = a.elements;
    const elsB = b.elements;

    if (elsA.length > 1 || elsB.length > 1) {
      return { error: 'Bred creatures can\'t breed again yet — pair two you caught.' };
    }
    if (a.uid === b.uid) {
      return { error: 'A creature can\'t pair with itself.' };
    }

    const sameElement = elsA[0] === elsB[0];

    // Inherited line: average the parents, with a chance at the better value.
    // This is what makes two Scorchkits from different parents differ.
    const inherited = {};
    for (const key of STAT_KEYS) {
      const av = a.bases[key];
      const bv = b.bases[key];
      const value = rng() < 0.25 ? Math.max(av, bv) : (av + bv) / 2;
      inherited[key] = value * range(rng, 0.94, 1.06);
    }

    const parentPower = (powerOf(a.bases) + powerOf(b.bases)) / 2;
    const rareBloom = rng() < RARE_BLOOM_CHANCE;

    let kind, elements, bases, name, look = null, personality = null;
    let speciesId = null, profile = null, hybrid = null;

    if (sameElement) {
      elements = [elsA[0]];
      const blend = a.speciesId && b.speciesId ? blendFor(a.speciesId, b.speciesId) : null;

      if (blend) {
        // The everyday case: two archetypes of one element combine.
        kind = 'blend';
        name = blend.name;
        look = blend.look;
        bases = fitToPower(inherited, { hp: 1, atk: 1, def: 1, spd: 1 },
          parentPower * BLEND_POWER_BONUS);
      } else {
        // Same species paired together — refine the line instead.
        kind = 'refined';
        const parent = rng() < 0.5 ? a : b;
        name = parent.name;
        speciesId = parent.speciesId;
        bases = fitToPower(inherited, { hp: 1, atk: 1, def: 1, spd: 1 },
          parentPower * REFINED_POWER_BONUS);
      }
    } else if (rng() < HYBRID_SUCCESS_CHANCE) {
      // The rare one — two elements genuinely fuse.
      kind = 'hybrid';
      elements = orderElements(elsA[0], elsB[0]);
      hybrid = hybridName(elements[0], elements[1]);
      profile = HYBRID_PROFILES[hybrid];
      name = profile.name;
      look = profile.look;
      personality = profile.personality;
      // powerMult compensates for shape extremity — equal power is NOT equal
      // strength. Solved empirically by `node hybrids.js solve`.
      bases = fitToPower(inherited, profile.bias,
        parentPower * HYBRID_POWER_BONUS * (profile.powerMult || 1));
    } else {
      // The resonance didn't hold. The egg carries one parent's line through.
      kind = 'throwback';
      const parent = rng() < 0.5 ? a : b;
      elements = [parent.elements[0]];
      name = parent.name;
      speciesId = parent.speciesId;
      bases = fitToPower(inherited, { hp: 1, atk: 1, def: 1, spd: 1 },
        parentPower * REFINED_POWER_BONUS);
    }

    const child = createMonster({
      speciesId, elements, bases, name,
      level: 5,
      bond: 50,       // bred creatures start bonded (§7)
      rareBloom,
      bred: true,
    });
    if (look) child.look = look;
    if (personality) child.personality = personality;

    return {
      egg: {
        kind,
        child,
        rareBloom,
        hybridElement: hybrid,
        element: elements[0],
        charge: 0,
        chargeNeeded: HATCH_CHARGE[kind],
        parents: [a.name, b.name],
      },
      kind,
      rareBloom,
      hybridElement: hybrid,
      profile,
    };
  }

  /** Add Charge to an egg. Returns true once it is ready to hatch. */
  function feedEgg(egg, amount) {
    egg.charge = Math.min(egg.chargeNeeded, egg.charge + amount);
    return egg.charge >= egg.chargeNeeded;
  }

  const eggReady = (egg) => egg.charge >= egg.chargeNeeded;

  // ---------------------------------------------------------------------------
  // Encounters
  // ---------------------------------------------------------------------------

  /*
   * Regions (§11) — lightly fictionalised US biomes, travelled in order.
   *
   * Each region stages a slice of the roster, so you meet creatures gradually
   * rather than all 18 in the first field. Overlap between neighbouring regions
   * keeps early creatures relevant instead of instantly obsolete.
   *
   * Names are placeholders. See naming.md.
   */
  const REGIONS = [
    {
      id: 'hollow_ridge',
      name: 'Hollow Ridge',
      inspiration: 'Appalachia — the Smokies',
      blurb: 'Layered blue ridges, morning fog that never quite burns off, ' +
             'and creek beds under old hardwood.',
      elements: ['verdant', 'terra', 'tide'],
      minLevel: 3, maxLevel: 8, unlockAt: 1,
      spawns: ['sproutle', 'thornip', 'puddlup', 'pebbet', 'burrowl', 'wickle'],
      beat: 'A micro-rift opens behind the family lab. Something frightened comes through.',
    },
    {
      id: 'bayou_verge',
      name: 'Bayou Verge',
      inspiration: 'Gulf Coast — Louisiana wetlands',
      blurb: 'Black water under cypress knees, air thick enough to lean on, ' +
             'and something moving just under the surface.',
      elements: ['tide', 'verdant'],
      minLevel: 7, maxLevel: 12, unlockAt: 7,
      spawns: ['finwhisk', 'brineclaw', 'puddlup', 'sproutle', 'fernfawn', 'shalebug'],
      beat: 'You witness a Meridian crew lattice an entire wild herd, and recover a dropped Catalyst.',
    },
    {
      id: 'sunstone_basin',
      name: 'Sunstone Basin',
      inspiration: 'Desert Southwest — Sonoran canyons',
      blurb: 'Red rock stacked in shelves, heat coming up off the stone, ' +
             'and shade worth fighting over.',
      elements: ['ember', 'terra'],
      minLevel: 11, maxLevel: 16, unlockAt: 11,
      spawns: ['scorchtail', 'wickle', 'coalpaw', 'shalebug', 'pebbet', 'snapcoil'],
      beat: 'A Meridian researcher defects, trading the facility\'s location for protection.',
    },
    {
      id: 'thunder_flats',
      name: 'Thunder Flats',
      inspiration: 'Great Plains — tornado alley',
      blurb: 'Grass to the horizon and a sky doing all the work. ' +
             'You see the weather coming an hour before it arrives.',
      elements: ['gale', 'spark'],
      minLevel: 15, maxLevel: 20, unlockAt: 15,
      spawns: ['ruffle', 'breezel', 'kitewing', 'voltmoth', 'bolthorn', 'snapcoil'],
      beat: 'The extraction is destabilising the rift. The other world is collapsing because of the harvest.',
    },
    {
      id: 'evergreen_reach',
      name: 'Evergreen Reach',
      inspiration: 'Pacific Northwest — Cascades old growth',
      blurb: 'Old growth, standing water, moss over everything. ' +
             'The rift is thinnest here, and everything knows it.',
      elements: ['spark', 'tide', 'ember', 'verdant', 'terra', 'gale'],
      minLevel: 19, maxLevel: 25, unlockAt: 19,
      spawns: SPECIES.map((s) => s.id),
      beat: 'Confronting Reeve. Closing the rift would strand everything on the wrong side of it.',
    },
  ];

  const regionById = (id) => REGIONS.find((r) => r.id === id);

  /** Regions unlock on your strongest creature's level. */
  const regionUnlocked = (region, bestLevel) => bestLevel >= region.unlockAt;

  /**
   * Roll a wild encounter for a region.
   *
   * The level comes from the region's band but is capped just above the
   * player's best creature. Region drives progression; the cap preserves the
   * difficulty fix from playtest.js — an under-levelled player is never thrown
   * at something they cannot handle.
   */
  function randomWild(rng, bestLevel, regionId) {
    const region = regionId ? regionById(regionId) : REGIONS[0];
    const ids = region ? region.spawns : SPECIES.map((s) => s.id);

    const pool = [];
    for (const id of ids) {
      const s = speciesById(id);
      if (!s) continue;
      const w = SPAWN_WEIGHT[s.rarity];
      for (let i = 0; i < w; i++) pool.push(s);
    }
    const sp = pick(rng, pool);

    const span = region.maxLevel - region.minLevel;
    let level = region.minLevel + Math.floor(rng() * (span + 1));
    if (typeof bestLevel === 'number') {
      level = Math.min(level, bestLevel + 1);
    }
    level = Math.max(3, Math.min(MAX_LEVEL, level));

    return createMonster({ speciesId: sp.id, level, bond: 0 });
  }

  // ---------------------------------------------------------------------------

  return {
    // config
    CONFIG, configure, MAX_LEVEL, TIERS, TRUST_REQUIRED,
    RARE_BLOOM_CHANCE, STATUSES,
    // data
    ELEMENT_CYCLE, ELEMENTS, SPECIES, HYBRID_NAMES, HYBRID_PROFILES,
    BLENDS, blendKey, blendFor, HATCH_CHARGE, HYBRID_SUCCESS_CHANCE,
    REGIONS, regionById, regionUnlocked,
    // helpers
    makeRng, speciesById, typeMultiplier, defenseMultiplier, oppositeElement,
    hybridName, hybridKey, orderElements, statAt, movesFor, powerOf, fitToPower,
    // core
    createMonster, damage, expectedDamage, chooseMove, chooseWildMove, effectiveSpd,
    createBattle, resolveTurn, activeMonster, affordable,
    canAttune, attune, attuneZoneWidth, attuneSpeed, fleeChanceAfterFailure, ATTUNE,
    breed, feedEgg, eggReady, randomWild,
    // progression
    xpToNext, grantXp, xpForWin, recomputeStats,
  };
});

</script>
<script>
const G = window.Infinimon;
const app = document.getElementById('app');
const rng = G.makeRng(Date.now() % 100000);

// ---------------------------------------------------------------------------
// state
// ---------------------------------------------------------------------------

const S = {
  view: 'start',
  team: [],
  crystals: { spark: 2, tide: 2, ember: 2, verdant: 2, terra: 2, gale: 2 },
  catalysts: 3,
  charge: 0,
  dex: new Set(),
  banked: {},
  battle: null,
  eggs: [],
  region: 'hollow_ridge',
  seenBeats: [],
  breedPick: [],
  lastResult: null,
  attune: null,
};

// ---------------------------------------------------------------------------
// persistence
//
// Monsters are rebuilt through createMonster rather than restored wholesale, so
// derived fields (moves, computed stats) always match the current engine. Only
// the things the engine cannot re-derive are stored.
// ---------------------------------------------------------------------------

const SAVE_KEY = 'infinimon.save.v1';

function packMonster(m) {
  return {
    s: m.speciesId, n: m.name, e: m.elements, b: m.bases,
    lv: m.level, xp: m.xp || 0, bo: m.bond, hp: m.hp,
    rb: !!m.rareBloom, br: !!m.bred,
  };
}

function unpackMonster(d) {
  const m = G.createMonster({
    speciesId: d.s, elements: d.e, bases: d.b, name: d.n,
    level: d.lv, bond: d.bo, rareBloom: d.rb, bred: d.br,
  });
  m.xp = d.xp;
  m.hp = Math.max(1, Math.min(m.maxHp, d.hp));
  // Personality and look are re-derived from the hybrid profile rather than
  // stored, so edits to the profiles show up on existing saves.
  if (m.elements.length > 1) {
    const prof = G.HYBRID_PROFILES[G.hybridName(m.elements[0], m.elements[1])];
    if (prof) { m.personality = prof.personality; m.look = prof.look; }
  }
  return m;
}

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      team: S.team.map(packMonster),
      crystals: S.crystals,
      catalysts: S.catalysts,
      charge: S.charge,
      dex: [...S.dex],
      banked: S.banked,
      region: S.region,
      seenBeats: S.seenBeats,
      eggs: S.eggs.map((e) => ({
        k: e.kind, c: e.charge, cn: e.chargeNeeded, el: e.element,
        rb: !!e.rareBloom, he: e.hybridElement, p: e.parents,
        ch: packMonster(e.child),
      })),
    }));
  } catch (e) { /* private browsing or quota — play on without a save */ }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.team || !d.team.length) return false;
    S.team = d.team.map(unpackMonster);
    S.crystals = Object.assign(S.crystals, d.crystals || {});
    S.catalysts = d.catalysts ?? S.catalysts;
    S.charge = d.charge ?? 0;
    S.dex = new Set(d.dex || []);
    S.banked = d.banked || {};
    S.region = d.region && G.regionById(d.region) ? d.region : 'hollow_ridge';
    S.seenBeats = d.seenBeats || [];
    S.eggs = (d.eggs || []).map((e) => ({
      kind: e.k, charge: e.c, chargeNeeded: e.cn, element: e.el,
      rareBloom: e.rb, hybridElement: e.he, parents: e.p,
      child: unpackMonster(e.ch),
    }));
    return true;
  } catch (e) { return false; }
}

function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* nothing to clear */ }
}

const el = (e) => G.ELEMENTS[e];
const bestLevel = () => (S.team.length ? Math.max(...S.team.map((m) => m.level)) : 1);
const initial = (m) => m.name[0].toUpperCase();
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function blobStyle(m, big) {
  const c = el(m.elements[0]).color;
  const c2 = m.elements[1] ? el(m.elements[1]).color : c;
  return `background:linear-gradient(140deg,${c},${c2});` +
    (m.rareBloom ? 'box-shadow:0 0 0 3px var(--gold),inset 0 -6px 14px rgba(0,0,0,.28);' : '');
}

function monRow(m, extra) {
  return `<div class="mon">
    <div class="blob" style="${blobStyle(m)}">${initial(m)}</div>
    <div style="flex:1;min-width:0">
      <div class="nm">${esc(m.name)} ${m.rareBloom ? '<span style="color:var(--gold)">&#10022;</span>' : ''}</div>
      <div class="meta">Lv ${m.level} &middot; ${esc(m.elementLabel)} &middot; ${m.hp}/${m.maxHp} HP</div>
      ${extra || ''}
    </div>
  </div>`;
}

function hpBar(m) {
  const p = (m.hp / m.maxHp) * 100;
  const cls = p > 50 ? '' : p > 25 ? 'mid' : 'low';
  return `<div class="bar"><div class="hpfill ${cls}" style="width:${p}%"></div></div>`;
}

function focusPips(n) {
  let s = '<div class="focus">';
  for (let i = 0; i < G.CONFIG.FOCUS_MAX; i++) s += `<div class="pip ${i < n ? 'on' : ''}"></div>`;
  return s + '</div>';
}

function eggCard() {
  if (!S.eggs.length) return '';
  return `<div class="card">
    <h2>Incubating (${S.eggs.length}/${MAX_EGGS})</h2>
    ${S.eggs.map((e, i) => {
      const pct = Math.round((e.charge / e.chargeNeeded) * 100);
      const ready = G.eggReady(e);
      const c = el(e.element).color;
      return `<div style="margin-bottom:10px">
        <div class="mon">
          <div class="blob" style="background:linear-gradient(160deg,${c},#0c1017);
            border-radius:50% 50% 46% 46% / 60% 60% 40% 40%">${ready ? '!' : '&middot;'}</div>
          <div style="flex:1;min-width:0">
            <div class="nm">${ready ? 'Ready to hatch' : 'Egg'}</div>
            <div class="meta">${esc(e.parents.join(' + '))} &middot;
              ${e.charge}/${e.chargeNeeded} Charge</div>
            <div class="bar"><div class="hpfill${ready ? '' : ' mid'}" style="width:${pct}%"></div></div>
          </div>
        </div>
        ${ready ? `<button class="primary" style="margin-top:8px" data-act="hatch" data-i="${i}">Hatch it</button>` : ''}
      </div>`;
    }).join('')}
    <div class="note">Eggs draw Charge from every battle you fight. Rarer results
    need more of it, so some hatch long before others.</div>
  </div>`;
}

function resourceBar() {
  const c = Object.entries(S.crystals).map(([k, v]) =>
    `<span style="color:${el(k).color}">&#9670;</span>${v}`).join(' ');
  return `<div class="res"><span>Crystals ${c}</span>
    <span>Catalysts <b>${S.catalysts}</b></span>
    <span>Charge <b>${S.charge}</b></span>
    <span>Dex <b>${S.dex.size}</b>/${DEX_TOTAL}</span></div>`;
}

// ---------------------------------------------------------------------------
// views
// ---------------------------------------------------------------------------

const VIEWS = {};

VIEWS.start = () => {
  const starters = ['wickle', 'puddlup', 'sproutle'].map((id) => G.speciesById(id));
  return `<h1>Infinimon</h1>
  <div class="sub">Playable prototype &middot; all names and art are placeholders</div>
  <div class="card">
    <h2>Choose a partner</h2>
    ${starters.map((s) => `<button data-act="pick" data-id="${s.id}" style="margin-bottom:8px">
      <div class="mon">
        <div class="blob" style="background:${el(s.element).color}">${s.name[0]}</div>
        <div><div class="nm">${s.name}</div>
        <div class="meta">${el(s.element).name} &middot; ${s.look}</div></div>
      </div></button>`).join('')}
    <div class="note">This prototype exists to test whether taming and breeding feel
    good. Battle numbers come from the same engine the balance simulation runs on.</div>
  </div>`;
};

VIEWS.home = () => {
  const alive = S.team.filter((m) => m.hp > 0).length;
  const region = G.regionById(S.region);
  return `<h1>${esc(region.name)}</h1>
  <div class="sub">${S.team.length} Infinimon &middot; ${alive} ready &middot;
    wild Lv ${region.minLevel}&ndash;${region.maxLevel}</div>
  <div class="card">${resourceBar()}</div>
  ${eggCard()}
  <div class="card">
    <button class="primary" data-act="explore" ${alive ? '' : 'disabled'}>Explore</button>
    <div class="row" style="margin-top:8px">
      <button data-act="view" data-v="regions">Travel</button>
      <button data-act="view" data-v="lab">Chamber</button>
      <button data-act="view" data-v="team">Team</button>
    </div>
    ${alive ? '' : `<button style="margin-top:8px" data-act="rest">Rest &amp; heal (all)</button>`}
    <div class="note">Progress saves automatically in this browser.
      <a href="#" data-act="reset" style="color:var(--dim)">Start over</a>.</div>
  </div>
  <div class="card">
    <h2>Your Infinimon</h2>
    ${S.team.map((m, i) => `<div style="margin-bottom:10px">${monRow(m)}${hpBar(m)}</div>`).join('')
      || '<div class="meta">None yet.</div>'}
  </div>`;
};

VIEWS.battle = () => {
  const b = S.battle;
  const p = G.activeMonster(b);
  const w = b.wild;
  const canTame = G.canAttune(w);
  const req = G.TRUST_REQUIRED[w.rarity];

  return `<h1>Wild ${esc(w.name)}</h1>
  <div class="sub">${esc(w.elementLabel)} &middot; ${w.rarity} &middot; needs ${req} Trust</div>

  <div class="card">
    ${monRow(w)}${hpBar(w)}
    <div class="meta" style="margin-top:6px">${Math.round((w.hp / w.maxHp) * 100)}% HP
      ${canTame ? '&middot; <span style="color:var(--good)">Attune available</span>'
                : '&middot; weaken below 50% to attune'}</div>
  </div>

  <div class="card">
    ${monRow(p)}${hpBar(p)}${focusPips(b.playerFocus)}
  </div>

  <div class="card">
    <h2>Moves</h2>
    <div class="grid2">
      ${p.moves.map((mv, i) => {
        const afford = mv.focus <= b.playerFocus;
        const dmg = G.expectedDamage(p, w, mv);
        const mult = G.defenseMultiplier(mv.element, w.elements);
        const tag = mult > 1.05 ? '<span style="color:var(--good)">&#9650;</span>'
                  : mult < 0.95 ? '<span style="color:var(--bad)">&#9660;</span>' : '';
        return `<button data-act="move" data-i="${i}" ${afford ? '' : 'disabled'}>
          <div class="mv"><span style="color:${el(mv.element).color}">&#9670;</span>
          <span style="flex:1">${mv.name}</span></div>
          <div class="mv"><span class="pw">~${dmg} dmg ${tag}</span>
          <span class="cost">${mv.focus > 0 ? mv.focus + ' focus' : 'free'}</span></div>
        </button>`;
      }).join('')}
    </div>
    <div class="row" style="margin-top:8px">
      <button data-act="attune" ${canTame ? '' : 'disabled'}
        style="${canTame ? 'border-color:var(--good);color:var(--good)' : ''}">Attune</button>
      <button data-act="flee">Flee</button>
    </div>
  </div>

  <div class="log" id="log">${b.log.slice(-14).map((l) => `<div>${esc(l)}</div>`).join('')}</div>`;
};

VIEWS.attune = () => {
  const a = S.attune;
  const w = S.battle.wild;
  const banked = S.banked[w.speciesId] || 0;
  const req = G.TRUST_REQUIRED[w.rarity];
  const lowHp = w.hp / w.maxHp < 0.25;
  const crystals = S.crystals[w.elements[0]];
  const landed = a.taps.filter(Boolean).length;
  const running = landed + (a.crystal ? 1 : 0) + (lowHp ? 1 : 0) + banked;

  return `<h1>Attunement</h1>
  <div class="sub">Match ${esc(w.name)}'s frequency &middot; tap ${a.taps.length + 1} of 3</div>

  <div class="card">
    <div class="stat"><span>Trust needed</span><span>${req}</span></div>
    <div class="stat"><span>Taps landed</span><span>+${landed}</span></div>
    <div class="stat"><span>Crystal offered</span><span>${a.crystal ? '+1' : '—'}</span></div>
    <div class="stat"><span>Weakened below 25% HP</span><span>${lowHp ? '+1' : '—'}</span></div>
    <div class="stat"><span>Banked from earlier tries</span><span>${banked ? '+' + banked : '—'}</span></div>
    <div class="stat" style="border:none;padding-top:6px">
      <span style="color:var(--ink);font-weight:700">Trust so far</span>
      <span style="color:${running >= req ? 'var(--good)' : 'var(--ink)'}">${running} / ${req}</span></div>
  </div>

  <div class="card">
    <div id="track">
      <div id="zone"></div>
      <div id="needle"></div>
    </div>
    <div class="trust">
      ${[0, 1, 2].map((i) => `<div class="tdot ${a.taps[i] ? 'hit' : ''}"></div>`).join('')}
    </div>
    <button class="primary" style="margin-top:12px" data-act="tap">Tap while the needle is in the green</button>
    ${!a.crystal && a.taps.length === 0 ? `<button style="margin-top:8px" data-act="crystal"
      ${crystals > 0 ? '' : 'disabled'}>Offer a ${el(w.elements[0]).name} Crystal (${crystals} left)
      &mdash; +1 Trust, wider zone</button>` : ''}
    <div class="note">The zone stays put, and it widens while the needle slows as
    ${esc(w.name)} settles. If this attempt falls short you stay in the fight and
    keep every point of Trust you earned.</div>
  </div>`;
};

VIEWS.result = () => {
  const r = S.lastResult;
  return `<div class="card banner">
    <div class="t" style="color:${r.good ? 'var(--good)' : 'var(--bad)'}">${esc(r.title)}</div>
    <div class="meta">${esc(r.body)}</div>
    ${r.mon ? `<div style="margin:16px auto;display:flex;justify-content:center">
      <div class="blob big" style="${blobStyle(r.mon, true)}">${initial(r.mon)}</div></div>
      <div class="nm">${esc(r.mon.name)}</div>
      <div class="meta">Lv ${r.mon.level} &middot; ${esc(r.mon.elementLabel)} &middot;
        ${r.mon.maxHp} HP / ${r.mon.atk} ATK / ${r.mon.def} DEF / ${r.mon.spd} SPD</div>
      ${r.mon.look ? `<div class="meta" style="margin-top:10px;font-style:italic">
        &ldquo;${esc(r.mon.look)}&rdquo;</div>` : ''}
      ${r.mon.personality ? `<div class="meta" style="margin-top:4px">${esc(r.mon.personality)}</div>` : ''}` : ''}
    <button class="primary" style="margin-top:16px" data-act="view" data-v="home">Continue</button>
  </div>`;
};

VIEWS.lab = () => {
  const eligible = S.team.filter((m) => m.elements.length === 1);
  const [a, b] = S.breedPick.map((uid) => S.team.find((m) => m.uid === uid));
  const ready = a && b && a.uid !== b.uid;
  const full = S.eggs.length >= MAX_EGGS;
  const canBreed = ready && S.catalysts > 0 && !full;

  return `<h1>Resonance Chamber</h1>
  <div class="sub">Pair two of the same element to blend them</div>
  <div class="card">${resourceBar()}</div>
  ${eggCard()}
  <div class="card">
    <h2>Select two</h2>
    ${eligible.map((m) => `<button data-act="breedpick" data-uid="${m.uid}"
      class="${S.breedPick.includes(m.uid) ? 'sel' : ''}" style="margin-bottom:8px">
      ${monRow(m, `<div class="meta">${esc(G.speciesById(m.speciesId)
        ? G.speciesById(m.speciesId).archetype : 'bred')}</div>`)}</button>`).join('')
      || '<div class="meta">Tame more Infinimon first.</div>'}
  </div>
  ${ready ? (() => {
    const sameEl = a.elements[0] === b.elements[0];
    const blend = sameEl && a.speciesId && b.speciesId
      ? G.blendFor(a.speciesId, b.speciesId) : null;
    const hyb = sameEl ? null : G.hybridName(a.elements[0], b.elements[0]);
    const prof = hyb ? G.HYBRID_PROFILES[hyb] : null;

    let resultLabel, detail, charge;
    if (blend) {
      resultLabel = esc(blend.name);
      detail = `<em>${esc(blend.look)}</em>`;
      charge = G.HATCH_CHARGE.blend;
    } else if (sameEl) {
      resultLabel = 'Refined ' + esc(a.name);
      detail = 'Same species — a stronger version of the same line.';
      charge = G.HATCH_CHARGE.refined;
    } else {
      resultLabel = `Usually a ${esc(a.name)} or ${esc(b.name)}`;
      detail = `<strong style="color:var(--gold)">${Math.round(G.HYBRID_SUCCESS_CHANCE * 100)}% chance</strong> ` +
        `the elements fuse into ${esc(prof.name)} (${esc(hyb)}) instead — ` +
        `<em>${esc(prof.look)}</em>. Cross-element eggs are slow: ` +
        `${G.HATCH_CHARGE.hybrid} Charge if it fuses.`;
      charge = G.HATCH_CHARGE.throwback;
    }

    return `<div class="card">
    <div class="stat"><span>Result</span><span>${resultLabel}</span></div>
    <div class="note" style="margin:8px 0 10px">${detail}</div>
    <div class="stat"><span>Charge to hatch</span><span>${charge}</span></div>
    <div class="stat"><span>Rift Catalyst</span><span>${S.catalysts} available</span></div>
    <button class="primary" style="margin-top:12px" data-act="breed" ${canBreed ? '' : 'disabled'}>
      ${canBreed ? 'Begin resonance'
        : full ? 'Chamber full — hatch an egg first' : 'No Catalyst'}</button>
    <div class="note">Eggs draw Charge from battling, not from waiting.</div>
  </div>`;
  })() : ''}
  <button data-act="view" data-v="home">Back</button>`;
};

VIEWS.regions = () => {
  const best = bestLevel();
  return `<h1>Travel</h1>
  <div class="sub">Regions open up as your strongest Infinimon grows</div>
  ${G.REGIONS.map((r) => {
    const open = G.regionUnlocked(r, best);
    const here = S.region === r.id;
    const dots = r.elements.map((e) =>
      `<span style="color:${el(e).color}">&#9670;</span>`).join('');
    return `<div class="card" style="${here ? 'border-color:var(--accent)' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <div class="nm">${esc(r.name)} ${here ? '<span style="color:var(--accent);font-size:11px">&mdash; here</span>' : ''}</div>
        <div class="meta">Lv ${r.minLevel}&ndash;${r.maxLevel}</div>
      </div>
      <div class="meta" style="margin-top:2px">${dots} &middot; ${esc(r.inspiration)}</div>
      <div class="note" style="margin-top:8px">${esc(r.blurb)}</div>
      ${open ? (here ? '' : `<button style="margin-top:10px" data-act="travel" data-r="${r.id}">Travel here</button>`)
        : `<div class="meta" style="margin-top:10px;color:var(--bad)">
             Locked &mdash; needs a Lv ${r.unlockAt} Infinimon (yours is Lv ${best})</div>`}
    </div>`;
  }).join('')}
  <button data-act="view" data-v="home">Back</button>`;
};

VIEWS.team = () => `<h1>Team</h1>
  <div class="sub">First three are your active party</div>
  ${S.team.map((m, i) => `<div class="card">
    ${monRow(m)}${hpBar(m)}
    <div style="margin-top:8px">
      <div class="stat"><span>ATK / DEF / SPD</span><span>${m.atk} / ${m.def} / ${m.spd}</span></div>
      <div class="stat"><span>XP</span><span>${m.level >= G.MAX_LEVEL ? 'max level'
        : (m.xp || 0) + ' / ' + G.xpToNext(m.level)}</span></div>
      <div class="stat"><span>Bond</span><span>${m.bond}${m.bond >= 60 ? ' (bonus active)' : ''}</span></div>
      <div class="stat"><span>Moves</span><span>${m.moves.map((v) => v.name).join(', ')}</span></div>
    </div>
    ${i > 0 ? `<button style="margin-top:8px" data-act="promote" data-uid="${m.uid}">Move to front</button>` : ''}
  </div>`).join('') || '<div class="card meta">Empty.</div>'}
  <button data-act="view" data-v="home">Back</button>`;

// ---------------------------------------------------------------------------
// render + actions
// ---------------------------------------------------------------------------

function render() {
  app.innerHTML = VIEWS[S.view]();
  const log = document.getElementById('log');
  if (log) log.scrollTop = log.scrollHeight;
  if (S.view === 'attune') startNeedle();
  if (S.team.length) saveGame();
}

function show(title, body, mon, good) {
  S.lastResult = { title, body, mon, good };
  S.view = 'result';
  render();
}

function addMonster(m) {
  S.team.push(m);
  S.dex.add(m.name);
}

app.addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-act]');
  if (!btn) return;
  if (btn.tagName === 'A') ev.preventDefault();
  const { act } = btn.dataset;

  if (act === 'reset') {
    if (!confirm('Start over? This clears your saved progress.')) return;
    clearSave();
    S.team = [];
    S.crystals = { spark: 2, tide: 2, ember: 2, verdant: 2, terra: 2, gale: 2 };
    S.catalysts = 3; S.charge = 0;
    S.dex = new Set(); S.banked = {}; S.battle = null; S.breedPick = []; S.eggs = [];
    S.region = 'hollow_ridge'; S.seenBeats = [];
    S.view = 'start';
    render();
    return;
  }

  if (act === 'pick') {
    addMonster(G.createMonster({ speciesId: btn.dataset.id, level: 5, bond: 40 }));
    // Choosing a starter IS the opening beat, so mark it seen rather than
    // firing it later when the player happens to travel back here.
    S.seenBeats = ['hollow_ridge'];
    S.view = 'home';
  }

  else if (act === 'view') { S.view = btn.dataset.v; S.breedPick = []; }

  else if (act === 'rest') {
    S.team.forEach((m) => { m.hp = m.maxHp; m.status = null; });
    S.view = 'home';
  }

  else if (act === 'explore') {
    const party = S.team.filter((m) => m.hp > 0).slice(0, 3);
    // Wild levels track your strongest monster and never outrun it. Previously
    // they rolled 5-7 against a starter permanently stuck at 5.
    const wild = G.randomWild(rng, Math.max(...party.map((m) => m.level)), S.region);
    S.battle = G.createBattle(party, wild, rng);
    S.battle.log.push(`A wild ${wild.name} appears!`);
    S.view = 'battle';
  }

  else if (act === 'move') {
    const b = S.battle;
    const p = G.activeMonster(b);
    G.resolveTurn(b, p.moves[+btn.dataset.i]);
    afterTurn();
  }

  else if (act === 'attune') {
    S.attune = { taps: [], crystal: false, t: 0 };
    S.view = 'attune';
  }

  else if (act === 'crystal') {
    const e = S.battle.wild.elements[0];
    if (S.crystals[e] > 0) { S.crystals[e] -= 1; S.attune.crystal = true; }
  }

  else if (act === 'tap') doTap();

  else if (act === 'flee') { S.battle = null; S.view = 'home'; }

  else if (act === 'breedpick') {
    const uid = +btn.dataset.uid;
    const i = S.breedPick.indexOf(uid);
    if (i >= 0) S.breedPick.splice(i, 1);
    else { S.breedPick.push(uid); if (S.breedPick.length > 2) S.breedPick.shift(); }
  }

  else if (act === 'travel') {
    const r = G.regionById(btn.dataset.r);
    if (r && G.regionUnlocked(r, bestLevel())) {
      S.region = r.id;
      if (!S.seenBeats.includes(r.id)) {
        S.seenBeats.push(r.id);
        show(r.name, r.beat, null, true);
        render();
        return;
      }
      S.view = 'home';
    }
  }

  else if (act === 'breed') doBreed();

  else if (act === 'hatch') { doHatch(+btn.dataset.i); return; }

  else if (act === 'promote') {
    const uid = +btn.dataset.uid;
    const i = S.team.findIndex((m) => m.uid === uid);
    S.team.unshift(S.team.splice(i, 1)[0]);
  }

  render();
});

/** Award XP to everyone still standing, and report any level-ups. */
function awardXp(party, wildLevel) {
  const gained = [];
  party.forEach((m) => {
    if (m.hp <= 0) return;
    const { levels } = G.grantXp(m, G.xpForWin(m.level, wildLevel));
    if (levels) gained.push(`${m.name} reached Lv ${m.level}`);
  });
  return gained.length ? ' ' + gained.join('. ') + '.' : '';
}

/** Everyone recovers a chunk of HP after every encounter, win or lose. */
function healParty(fraction) {
  S.team.forEach((m) => {
    m.status = null;
    m.hp = Math.min(m.maxHp, Math.max(m.hp, 0) + Math.round(m.maxHp * fraction));
    if (m.hp <= 0) m.hp = Math.round(m.maxHp * fraction);
  });
}

function afterTurn() {
  const b = S.battle;
  if (!b.over) return;
  stopNeedle();
  if (b.outcome === 'wild_fainted') {
    const gain = 8 + Math.floor(rng() * 8);
    S.charge += gain;
    feedEggs(gain);
    b.team.forEach((m) => { if (m.hp > 0) m.bond = Math.min(100, m.bond + 2); });
    const e = b.wild.elements[0];
    S.crystals[e] += 1;
    const lv = awardXp(b.team, b.wild.level);
    S.battle = null;
    healParty(G.CONFIG.POST_BATTLE_HEAL);
    show('The wild Infinimon fled', `It escaped before you could attune. ` +
      `+${gain} Charge, +1 ${el(e).name} Crystal.` + lv, null, false);
  } else {
    S.team.forEach((m) => { m.bond = Math.max(0, m.bond - 5); });
    Object.keys(S.crystals).forEach((k) => { S.crystals[k] = Math.floor(S.crystals[k] / 2); });
    S.battle = null;
    // Recalled to the Lab means a full recovery — losing costs crystals, not time.
    S.team.forEach((m) => { m.hp = m.maxHp; m.status = null; });
    show('Recalled to the Lab', 'Your party is patched up. You lost half your crystals — nothing else.', null, false);
  }
}

const MAX_EGGS = 4;
// 18 base creatures + 18 same-element blends + 15 rare cross-element hybrids.
const DEX_TOTAL = G.SPECIES.length + Object.keys(G.BLENDS).length +
  Object.keys(G.HYBRID_PROFILES).length;

function doBreed() {
  const [a, b] = S.breedPick.map((uid) => S.team.find((m) => m.uid === uid));
  const res = G.breed(a, b, rng);
  if (res.error) { alert(res.error); return; }
  if (S.eggs.length >= MAX_EGGS) { alert('The chamber is full — hatch an egg first.'); return; }

  S.catalysts -= 1;
  S.breedPick = [];
  S.eggs.push(res.egg);

  // The egg keeps its result hidden until it hatches. Charge comes from
  // battling, so the reveal is earned rather than waited out.
  show('An egg!',
    `${a.name} and ${b.name} produced an egg. It needs ${res.egg.chargeNeeded} Charge ` +
    `to hatch — battle to build it up.`, null, true);
}

function doHatch(index) {
  const egg = S.eggs[index];
  if (!egg || !G.eggReady(egg)) return;
  S.eggs.splice(index, 1);
  addMonster(egg.child);

  const title = egg.rareBloom ? 'A Rare Bloom hatched!'
    : egg.kind === 'hybrid' ? 'The elements fused!'
    : egg.kind === 'blend' ? 'A new blend hatched'
    : 'The egg hatched';
  const body = egg.rareBloom ? 'Alternate palette and +10% to every stat.'
    : egg.kind === 'hybrid' ? `Against the odds, ${egg.parents.join(' and ')} produced a ` +
        `${egg.hybridElement}-element Infinimon. These are rare.`
    : egg.kind === 'blend' ? `${egg.parents.join(' and ')} combined into something new.`
    : `The resonance didn't hold — the egg carried a parent's line through instead.`;

  show(title, body, egg.child, true);
}

/** Every egg in the chamber gains Charge from a battle. */
function feedEggs(amount) {
  S.eggs.forEach((e) => G.feedEgg(e, amount));
}

// ---------------------------------------------------------------------------
// attunement minigame
// ---------------------------------------------------------------------------

let raf = null;

function zoneWidth() {
  return G.attuneZoneWidth(S.battle.wild, {
    crystalMatch: S.attune.crystal,
    tapsLanded: S.attune.taps.filter(Boolean).length,
  });
}

function placeZone() {
  const zone = document.getElementById('zone');
  if (!zone) return;
  const w = zoneWidth();
  // The zone is chosen once per attempt and then held. Widening it as taps land
  // keeps it anchored on the same centre so the target never jumps.
  if (S.attune.zoneCentre == null) S.attune.zoneCentre = 30 + rng() * 40;
  const start = Math.max(0, Math.min(100 - w, S.attune.zoneCentre - w / 2));
  S.attune.zoneStart = start;
  S.attune.zoneW = w;
  zone.style.left = start + '%';
  zone.style.width = w + '%';
}

function startNeedle() {
  stopNeedle();
  const needle = document.getElementById('needle');
  if (!needle) return;
  placeZone();

  let t = S.attune.t || 0;
  const step = () => {
    const speed = G.attuneSpeed(S.battle.wild, S.attune.taps.filter(Boolean).length);
    t += 0.016 * speed;
    // triangle wave, 0..1, so the needle sweeps back and forth
    const pos = Math.abs(((t % 2) + 2) % 2 - 1);
    S.attune.pos = pos * 100;
    S.attune.t = t;
    needle.style.left = S.attune.pos + '%';
    raf = requestAnimationFrame(step);
  };
  step();
}

function stopNeedle() { if (raf) cancelAnimationFrame(raf); raf = null; }

function doTap() {
  const a = S.attune;
  const hit = a.pos >= a.zoneStart && a.pos <= a.zoneStart + a.zoneW;
  a.taps.push(hit);

  if (a.taps.length < 3) {
    // The zone stays where it is and widens; the needle slows. Both curves run
    // in the player's favour as the creature settles.
    placeZone();
    render();
    return;
  }

  stopNeedle();
  const wild = S.battle.wild;
  const banked = S.banked[wild.speciesId] || 0;
  const result = G.attune(wild, {
    taps: a.taps.filter(Boolean).length,
    crystalMatch: a.crystal,
    banked,
  });
  S.banked[wild.speciesId] = result.newBanked;

  if (result.success) {
    wild.bond = 30;
    wild.hp = wild.maxHp;
    addMonster(wild);
    const gain = 8 + Math.floor(rng() * 8);
    S.charge += gain;
    feedEggs(gain);
    const lv = awardXp(S.battle.team, wild.level);
    S.battle = null;
    show(`${wild.name} joined you!`,
      `Trust ${result.trust} of ${result.required}. +${gain} Charge.` + lv, wild, true);
  } else {
    // Falling short no longer ends the encounter outright. You usually stay in
    // the fight with your Trust banked — but the creature's patience is finite,
    // so each failure risks it bolting. That keeps retries from making taming a
    // formality without ever wasting the progress you earned.
    S.attune = null;
    S.battle.attuneFails = (S.battle.attuneFails || 0) + 1;
    const bolts = rng() < G.fleeChanceAfterFailure(S.battle.attuneFails);

    if (bolts) {
      const gain = 4 + Math.floor(rng() * 5);
      S.charge += gain;
      feedEggs(gain);
      S.battle = null;
      healParty(G.CONFIG.POST_BATTLE_HEAL);
      show(`${wild.name} bolted`,
        `Trust reached ${result.trust} of ${result.required}. It got away — but next time ` +
        `you meet a ${wild.name} you start with +${result.newBanked} Trust. +${gain} Charge.`,
        null, false);
      return;
    }

    S.view = 'battle';
    S.battle.log.push(
      `Attunement reached ${result.trust} of ${result.required} Trust. ` +
      `${wild.name} is wary but still here — +${result.newBanked} Trust banked.`);
    G.resolveTurn(S.battle, null); // trying costs you the turn
    afterTurn();
  }
}

if (loadGame()) S.view = 'home';
render();
</script>
