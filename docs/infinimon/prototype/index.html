<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Infinimon — Playable Prototype</title>
<style>
  /*
   * Deliberately single-theme: this is a game screen, not a document, and the
   * element palette only reads correctly against a dark ground. Every color is
   * declared on bare :root so the page holds on any host background.
   */
  :root {
    color-scheme: dark;
    --bg: #10141c; --panel: #1a2030; --panel2: #232b3d; --line: #2f3950;
    --ink: #e8edf7; --dim: #8f9ab4; --accent: #7fd4ff; --good: #6fcf7f;
    --bad: #f2704a; --gold: #f5d547;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif,
    system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 12px;
    min-height: 100vh;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  button:focus-visible, [data-act]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  #app { width: 100%; max-width: 460px; }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: .5px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--accent); text-transform: uppercase;
       letter-spacing: 1.2px; font-weight: 700; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
          padding: 14px; margin-bottom: 12px; }
  button {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    cursor: pointer; transition: .12s; width: 100%; text-align: left;
  }
  button:hover:not(:disabled) { border-color: var(--accent); background: #2b354a; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #06202c; border-color: var(--accent);
                   text-align: center; }
  button.primary:hover:not(:disabled) { background: #a3e2ff; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* creature placeholder art */
  .mon { display: flex; align-items: center; gap: 10px; }
  .blob { width: 54px; height: 54px; border-radius: 42% 58% 55% 45% / 52% 45% 55% 48%;
          display: grid; place-items: center; font-weight: 800; font-size: 20px;
          color: #0d1017; flex: none; box-shadow: inset 0 -6px 14px rgba(0,0,0,.28); }
  .blob.big { width: 78px; height: 78px; font-size: 28px; }
  .nm { font-weight: 700; }
  .meta { font-size: 11.5px; color: var(--dim); }
  .chip { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px;
          border-radius: 20px; letter-spacing: .4px; text-transform: uppercase;
          color: #0d1017; }

  .bar { height: 8px; background: #0c1017; border-radius: 6px; overflow: hidden;
         margin-top: 5px; border: 1px solid var(--line); }
  .bar > div { height: 100%; transition: width .35s ease; }
  .hpfill { background: var(--good); }
  .hpfill.mid { background: var(--gold); }
  .hpfill.low { background: var(--bad); }

  .focus { display: flex; gap: 4px; margin-top: 7px; }
  .pip { width: 15px; height: 6px; border-radius: 3px; background: #0c1017;
         border: 1px solid var(--line); }
  .pip.on { background: var(--accent); border-color: var(--accent); }

  .log { background: #0c1017; border: 1px solid var(--line); border-radius: 10px;
         padding: 9px 11px; height: 96px; overflow-y: auto; font-size: 12.5px;
         color: var(--dim); line-height: 1.55; }
  .log b { color: var(--ink); font-weight: 600; }

  .mv { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .mv .cost { font-size: 10.5px; color: var(--dim); font-weight: 700; }
  .mv .pw { font-size: 10.5px; color: var(--dim); }

  /* attunement */
  #track { position: relative; height: 46px; background: #0c1017; border-radius: 10px;
           border: 1px solid var(--line); overflow: hidden; margin: 12px 0; }
  #zone { position: absolute; top: 0; bottom: 0; background: rgba(111,207,127,.22);
          border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
  #needle { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--gold);
            box-shadow: 0 0 12px var(--gold); }
  .trust { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .tdot { width: 11px; height: 11px; border-radius: 50%; background: #0c1017;
          border: 1px solid var(--line); }
  .tdot.hit { background: var(--good); border-color: var(--good); }

  .banner { text-align: center; padding: 16px 10px; }
  .banner .t { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
  .stat { display: flex; justify-content: space-between; font-size: 12px;
          padding: 2px 0; border-bottom: 1px solid var(--line); }
  .stat span:last-child { font-weight: 700; }
  .note { font-size: 11px; color: var(--dim); margin-top: 10px; line-height: 1.5; }
  .sel { outline: 2px solid var(--accent); }
  .res { display: flex; gap: 10px; font-size: 11.5px; color: var(--dim); flex-wrap: wrap; }
  .res b { color: var(--gold); }

  /* ---- battle arena: the two creatures face each other, Pokemon-style ---- */
  .arena { position: relative; height: 250px; border-radius: 14px; overflow: hidden;
           border: 1px solid var(--line); margin-bottom: 12px;
           background:
             radial-gradient(120% 70% at 78% 22%, rgba(127,212,255,.10), transparent 60%),
             linear-gradient(#1b2542 0%, #131c33 52%, #0f1626 100%); }
  .slot { position: absolute; display: grid; place-items: center; }
  .slot.foe    { right: 9%;  top: 16%; }
  .slot.mine   { left: 9%;   bottom: 12%; }
  .ground { position: absolute; bottom: -8px; width: 108%; height: 22px; border-radius: 50%;
            background: rgba(0,0,0,.34); filter: blur(3px); }
  .sprite { position: relative; border-radius: 42% 58% 55% 45% / 52% 45% 55% 48%;
            display: grid; place-items: center; font-weight: 800; color: #0d1017;
            box-shadow: inset 0 -8px 18px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35); }
  .slot.foe  .sprite { width: 82px;  height: 82px;  font-size: 28px; }
  .slot.mine .sprite { width: 108px; height: 108px; font-size: 36px; }

  .infobox { position: absolute; background: rgba(16,21,32,.92); border: 1px solid var(--line);
             border-radius: 10px; padding: 7px 11px; min-width: 156px; backdrop-filter: blur(3px); }
  .infobox.foe  { left: 10px;  top: 12px; }
  .infobox.mine { right: 10px; bottom: 12px; }
  .infobox .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .infobox .nm2 { font-weight: 700; font-size: 13px; }
  .infobox .lv { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .infobox .hpnum { font-size: 10.5px; color: var(--dim); text-align: right;
                    font-variant-numeric: tabular-nums; margin-top: 2px; }

  /* attack lunge, hit shake, floating numbers */
  @keyframes lungeMine { 0%,100% { transform: none } 45% { transform: translate(26px,-20px) } }
  @keyframes lungeFoe  { 0%,100% { transform: none } 45% { transform: translate(-26px,20px) } }
  @keyframes shake { 0%,100% { transform: none } 20% { transform: translateX(-7px) }
                     50% { transform: translateX(7px) } 80% { transform: translateX(-4px) } }
  @keyframes flash { 0%,100% { filter: none } 40% { filter: brightness(2.4) saturate(.4) } }
  .sprite.lunge-mine { animation: lungeMine .42s ease; }
  .sprite.lunge-foe  { animation: lungeFoe .42s ease; }
  .sprite.hit { animation: shake .38s ease, flash .38s ease; }
  .sprite.faint { opacity: .18; transform: translateY(14px) scale(.86); transition: .5s ease; }

  @keyframes floatUp { 0% { opacity: 0; transform: translateY(6px) }
                       18% { opacity: 1 } 100% { opacity: 0; transform: translateY(-42px) } }
  .float { position: absolute; font-weight: 800; font-size: 19px; pointer-events: none;
           animation: floatUp 1.05s ease forwards; text-shadow: 0 2px 6px rgba(0,0,0,.7);
           font-variant-numeric: tabular-nums; }
  .float.dmg { color: #ff8f6b; }
  .float.heal { color: var(--good); }
  .float.glance { color: var(--dim); font-size: 15px; }
</style>
</head>
<body>
<div id="app"></div>

<script src="engine.js"></script>
<script>
const G = window.Infinimon;
const app = document.getElementById('app');
const rng = G.makeRng(Date.now() % 100000);

// ---------------------------------------------------------------------------
// state
// ---------------------------------------------------------------------------

const S = {
  view: 'start',
  team: [],
  crystals: { spark: 2, tide: 2, ember: 2, verdant: 2, terra: 2, gale: 2 },
  catalysts: 3,
  charge: 0,
  dex: new Set(),
  banked: {},
  battle: null,
  eggs: [],
  region: 'hollow_ridge',
  seenBeats: [],
  breedPick: [],
  lastResult: null,
  attune: null,
};

// ---------------------------------------------------------------------------
// persistence
//
// Monsters are rebuilt through createMonster rather than restored wholesale, so
// derived fields (moves, computed stats) always match the current engine. Only
// the things the engine cannot re-derive are stored.
// ---------------------------------------------------------------------------

const SAVE_KEY = 'infinimon.save.v1';

function packMonster(m) {
  return {
    s: m.speciesId, n: m.name, e: m.elements, b: m.bases,
    lv: m.level, xp: m.xp || 0, bo: m.bond, hp: m.hp,
    rb: !!m.rareBloom, br: !!m.bred,
    // Bred creatures have no species to derive an archetype from, so without
    // this they would lose their signature move on reload.
    ar: m.archetype || null,
  };
}

function unpackMonster(d) {
  const m = G.createMonster({
    speciesId: d.s, elements: d.e, bases: d.b, name: d.n, archetype: d.ar,
    level: d.lv, bond: d.bo, rareBloom: d.rb, bred: d.br,
  });
  m.xp = d.xp;
  m.hp = Math.max(1, Math.min(m.maxHp, d.hp));
  // Personality and look are re-derived from the hybrid profile rather than
  // stored, so edits to the profiles show up on existing saves.
  if (m.elements.length > 1) {
    const prof = G.HYBRID_PROFILES[G.hybridName(m.elements[0], m.elements[1])];
    if (prof) { m.personality = prof.personality; m.look = prof.look; }
  }
  return m;
}

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      team: S.team.map(packMonster),
      crystals: S.crystals,
      catalysts: S.catalysts,
      charge: S.charge,
      dex: [...S.dex],
      banked: S.banked,
      region: S.region,
      seenBeats: S.seenBeats,
      eggs: S.eggs.map((e) => ({
        k: e.kind, c: e.charge, cn: e.chargeNeeded, el: e.element,
        rb: !!e.rareBloom, he: e.hybridElement, p: e.parents,
        ch: packMonster(e.child),
      })),
    }));
  } catch (e) { /* private browsing or quota — play on without a save */ }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.team || !d.team.length) return false;
    S.team = d.team.map(unpackMonster);
    S.crystals = Object.assign(S.crystals, d.crystals || {});
    S.catalysts = d.catalysts ?? S.catalysts;
    S.charge = d.charge ?? 0;
    S.dex = new Set(d.dex || []);
    S.banked = d.banked || {};
    S.region = d.region && G.regionById(d.region) ? d.region : 'hollow_ridge';
    S.seenBeats = d.seenBeats || [];
    S.eggs = (d.eggs || []).map((e) => ({
      kind: e.k, charge: e.c, chargeNeeded: e.cn, element: e.el,
      rareBloom: e.rb, hybridElement: e.he, parents: e.p,
      child: unpackMonster(e.ch),
    }));
    return true;
  } catch (e) { return false; }
}

function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* nothing to clear */ }
}

const el = (e) => G.ELEMENTS[e];
const bestLevel = () => (S.team.length ? Math.max(...S.team.map((m) => m.level)) : 1);
const initial = (m) => m.name[0].toUpperCase();
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function blobStyle(m, big) {
  const c = el(m.elements[0]).color;
  const c2 = m.elements[1] ? el(m.elements[1]).color : c;
  return `background:linear-gradient(140deg,${c},${c2});` +
    (m.rareBloom ? 'box-shadow:0 0 0 3px var(--gold),inset 0 -6px 14px rgba(0,0,0,.28);' : '');
}

function monRow(m, extra) {
  return `<div class="mon">
    <div class="blob" style="${blobStyle(m)}">${initial(m)}</div>
    <div style="flex:1;min-width:0">
      <div class="nm">${esc(m.name)} ${m.rareBloom ? '<span style="color:var(--gold)">&#10022;</span>' : ''}</div>
      <div class="meta">Lv ${m.level} &middot; ${esc(m.elementLabel)} &middot; ${m.hp}/${m.maxHp} HP</div>
      ${extra || ''}
    </div>
  </div>`;
}

function buffChips(m) {
  const out = [];
  if (m.buffs && m.buffs.atk) out.push('ATK up');
  if (m.buffs && m.buffs.def) out.push('DEF up');
  if (m.buffs && m.buffs.spd && m.buffs.spd.mult < 1) out.push('slowed');
  if (m.status) out.push(G.STATUSES[m.status].name);
  return out.length
    ? `<div class="meta" style="margin-top:4px;color:var(--gold)">${out.join(' &middot; ')}</div>` : '';
}

function hpBar(m) {
  const p = (m.hp / m.maxHp) * 100;
  const cls = p > 50 ? '' : p > 25 ? 'mid' : 'low';
  return `<div class="bar"><div class="hpfill ${cls}" style="width:${p}%"></div></div>`;
}

function focusPips(n) {
  let s = '<div class="focus">';
  for (let i = 0; i < G.CONFIG.FOCUS_MAX; i++) s += `<div class="pip ${i < n ? 'on' : ''}"></div>`;
  return s + '</div>';
}

function eggCard() {
  if (!S.eggs.length) return '';
  return `<div class="card">
    <h2>Incubating (${S.eggs.length}/${MAX_EGGS})</h2>
    ${S.eggs.map((e, i) => {
      const pct = Math.round((e.charge / e.chargeNeeded) * 100);
      const ready = G.eggReady(e);
      const c = el(e.element).color;
      return `<div style="margin-bottom:10px">
        <div class="mon">
          <div class="blob" style="background:linear-gradient(160deg,${c},#0c1017);
            border-radius:50% 50% 46% 46% / 60% 60% 40% 40%">${ready ? '!' : '&middot;'}</div>
          <div style="flex:1;min-width:0">
            <div class="nm">${ready ? 'Ready to hatch' : 'Egg'}</div>
            <div class="meta">${esc(e.parents.join(' + '))} &middot;
              ${e.charge}/${e.chargeNeeded} Charge</div>
            <div class="bar"><div class="hpfill${ready ? '' : ' mid'}" style="width:${pct}%"></div></div>
          </div>
        </div>
        ${ready ? `<button class="primary" style="margin-top:8px" data-act="hatch" data-i="${i}">Hatch it</button>` : ''}
      </div>`;
    }).join('')}
    <div class="note">Eggs draw Charge from every battle you fight. Rarer results
    need more of it, so some hatch long before others.</div>
  </div>`;
}

function resourceBar() {
  const c = Object.entries(S.crystals).map(([k, v]) =>
    `<span style="color:${el(k).color}">&#9670;</span>${v}`).join(' ');
  return `<div class="res"><span>Crystals ${c}</span>
    <span>Catalysts <b>${S.catalysts}</b></span>
    <span>Charge <b>${S.charge}</b></span>
    <span>Dex <b>${S.dex.size}</b>/${DEX_TOTAL}</span></div>`;
}

// ---------------------------------------------------------------------------
// views
// ---------------------------------------------------------------------------

const VIEWS = {};

VIEWS.start = () => {
  const starters = ['wickle', 'puddlup', 'sproutle'].map((id) => G.speciesById(id));
  return `<h1>Infinimon</h1>
  <div class="sub">Playable prototype &middot; all names and art are placeholders</div>
  <div class="card">
    <h2>Choose a partner</h2>
    ${starters.map((s) => `<button data-act="pick" data-id="${s.id}" style="margin-bottom:8px">
      <div class="mon">
        <div class="blob" style="background:${el(s.element).color}">${s.name[0]}</div>
        <div><div class="nm">${s.name}</div>
        <div class="meta">${el(s.element).name} &middot; ${s.look}</div></div>
      </div></button>`).join('')}
    <div class="note">This prototype exists to test whether taming and breeding feel
    good. Battle numbers come from the same engine the balance simulation runs on.</div>
  </div>`;
};

VIEWS.home = () => {
  const alive = S.team.filter((m) => m.hp > 0).length;
  const region = G.regionById(S.region);
  return `<h1>${esc(region.name)}</h1>
  <div class="sub">${S.team.length} Infinimon &middot; ${alive} ready &middot;
    wild Lv ${region.minLevel}&ndash;${region.maxLevel}</div>
  <div class="card">${resourceBar()}</div>
  ${eggCard()}
  <div class="card">
    <button class="primary" data-act="explore" ${alive ? '' : 'disabled'}>Explore</button>
    <div class="row" style="margin-top:8px">
      <button data-act="view" data-v="regions">Travel</button>
      <button data-act="view" data-v="lab">Chamber</button>
      <button data-act="view" data-v="team">Team</button>
    </div>
    ${alive ? '' : `<button style="margin-top:8px" data-act="rest">Rest &amp; heal (all)</button>`}
    <div class="note">Progress saves automatically in this browser.
      <a href="#" data-act="reset" style="color:var(--dim)">Start over</a>.</div>
  </div>
  <div class="card">
    <h2>Your Infinimon</h2>
    ${S.team.map((m, i) => `<div style="margin-bottom:10px">${monRow(m)}${hpBar(m)}</div>`).join('')
      || '<div class="meta">None yet.</div>'}
  </div>`;
};

VIEWS.battle = () => {
  const b = S.battle;
  const p = G.activeMonster(b);
  const w = b.wild;
  const canTame = G.canAttune(w);
  const req = G.TRUST_REQUIRED[w.rarity];

  const infobox = (m, side) => {
    const pct = (m.hp / m.maxHp) * 100;
    const cls = pct > 50 ? '' : pct > 25 ? 'mid' : 'low';
    return `<div class="infobox ${side}">
      <div class="row1"><span class="nm2">${esc(m.name)}</span>
        <span class="lv">Lv ${m.level}</span></div>
      <div class="bar"><div class="hpfill ${cls}" style="width:${pct}%"></div></div>
      <div class="hpnum">${m.hp} / ${m.maxHp}</div>
      ${buffChips(m)}
    </div>`;
  };

  return `<div class="arena" id="arena">
    ${infobox(w, 'foe')}
    ${infobox(p, 'mine')}
    <div class="slot foe">
      <div class="ground"></div>
      <div class="sprite" id="sprite-wild" style="${blobStyle(w)}">${initial(w)}</div>
    </div>
    <div class="slot mine">
      <div class="ground"></div>
      <div class="sprite" id="sprite-player" style="${blobStyle(p)}">${initial(p)}</div>
    </div>
  </div>

  <div class="card">
    <div class="meta">Wild ${esc(w.name)} &middot; ${esc(w.elementLabel)} &middot;
      ${Math.round((w.hp / w.maxHp) * 100)}% HP
      ${canTame ? '&middot; <span style="color:var(--good)">ready to attune</span>'
                : '&middot; weaken below 50% to attune'}</div>
    ${focusPips(b.playerFocus)}
  </div>

  <div class="card">
    <h2>Moves</h2>
    <div class="grid2">
      ${p.moves.map((mv, i) => ({ mv, i })).filter(({ mv }) => (mv.learnAt || 1) <= p.level)
        .map(({ mv, i }) => {
        const afford = mv.focus <= b.playerFocus;
        const dmg = G.expectedDamage(p, w, mv);
        const mult = G.defenseMultiplier(mv.element, w.elements);
        const tag = mult > 1.05 ? '<span style="color:var(--good)">&#9650;</span>'
                  : mult < 0.95 ? '<span style="color:var(--bad)">&#9660;</span>' : '';
        const fx = G.moveEffectText(mv);
        return `<button data-act="move" data-i="${i}" ${afford ? '' : 'disabled'}>
          <div class="mv"><span style="color:${el(mv.element).color}">&#9670;</span>
          <span style="flex:1">${mv.name}</span></div>
          <div class="mv"><span class="pw">${mv.power > 0 ? '~' + dmg + ' dmg ' + tag : ''}</span>
          <span class="cost">${mv.focus > 0 ? mv.focus + ' focus' : 'free'}</span></div>
          ${fx ? `<div class="mv"><span class="pw" style="color:var(--good)">${fx}</span></div>` : ''}
        </button>`;
      }).join('')}
    </div>
    ${(() => {
      const nx = G.nextMoveAt(p);
      return nx ? `<div class="note">Learns <strong>${esc(nx.name)}</strong> at level ${nx.learnAt}.</div>` : '';
    })()}
    <div class="row" style="margin-top:8px">
      <button data-act="attune" ${canTame ? '' : 'disabled'}
        style="${canTame ? 'border-color:var(--good);color:var(--good)' : ''}">Attune (needs ${req} Trust)</button>
      <button data-act="flee">Flee</button>
    </div>
  </div>

  <div class="log" id="log">${b.log.slice(-14).map((l) => `<div>${esc(l)}</div>`).join('')}</div>`;
};

VIEWS.attune = () => {
  const a = S.attune;
  const w = S.battle.wild;
  const banked = S.banked[w.speciesId] || 0;
  const req = G.TRUST_REQUIRED[w.rarity];
  const lowHp = w.hp / w.maxHp < 0.25;
  const crystals = S.crystals[w.elements[0]];
  const landed = a.taps.filter(Boolean).length;

// ---------------------------------------------------------------------------
// render + actions
// ---------------------------------------------------------------------------

function render() {
  app.innerHTML = VIEWS[S.view]();
  const log = document.getElementById('log');
  if (log) log.scrollTop = log.scrollHeight;
  if (S.view === 'attune') startNeedle();
  if (S.view === 'battle') playBattleFx();
  if (S.team.length) saveGame();
}

/*
 * Replay the last turn's events on the arena: the attacker lunges, the target
 * shakes and flashes, and the number floats off it. Reads battle.fx, which the
 * engine fills during resolveTurn.
 */
function playBattleFx() {
  const b = S.battle;
  const arena = document.getElementById('arena');
  if (!b || !arena || !b.fx || !b.fx.length) return;

  const spriteOf = (side) =>
    document.getElementById(side === 'wild' ? 'sprite-wild' : 'sprite-player');

  b.fx.forEach((e, idx) => {
    const delay = idx * 260;

    setTimeout(() => {
      const target = spriteOf(e.target);
      if (!target) return;

      if (e.kind === 'hit') {
        const atk = spriteOf(e.attacker);
        if (atk) {
          atk.classList.add(e.attacker === 'wild' ? 'lunge-foe' : 'lunge-mine');
          setTimeout(() => atk.classList.remove('lunge-foe', 'lunge-mine'), 430);
        }
        setTimeout(() => {
          target.classList.add('hit');
          setTimeout(() => target.classList.remove('hit'), 400);
          floatNumber(target, e.glanced ? 'glance' : 'dmg',
            e.glanced ? 'glanced ' + e.amount : '-' + e.amount);
        }, 170);
      } else if (e.kind === 'heal') {
        floatNumber(target, 'heal', '+' + e.amount);
      }
    }, delay);
  });

  // Fade out anything that fainted once the hits have played.
  setTimeout(() => {
    const w = spriteOf('wild');
    const p = spriteOf('player');
    if (w && b.wild && b.wild.hp <= 0) w.classList.add('faint');
    const me = G.activeMonster(b);
    if (p && me && me.hp <= 0) p.classList.add('faint');
  }, b.fx.length * 260 + 220);
}

function floatNumber(anchor, cls, text) {
  const arena = document.getElementById('arena');
  if (!arena || !anchor) return;
  const a = anchor.getBoundingClientRect();
  const r = arena.getBoundingClientRect();
  const n = document.createElement('div');
  n.className = 'float ' + cls;
  n.textContent = text;
  n.style.left = (a.left - r.left + a.width / 2 - 18) + 'px';
  n.style.top = (a.top - r.top - 6) + 'px';
  arena.appendChild(n);
  setTimeout(() => n.remove(), 1100);
}

function show(title, body, mon, good) {
  S.lastResult = { title, body, mon, good };
  S.view = 'result';
  render();
}

function addMonster(m) {
  S.team.push(m);
  S.dex.add(m.name);
}

app.addEventListener('click', (ev) => {
  const btn = ev.target.closest('[data-act]');
  if (!btn) return;
  if (btn.tagName === 'A') ev.preventDefault();
  const { act } = btn.dataset;

  if (act === 'reset') {
    if (!confirm('Start over? This clears your saved progress.')) return;
    clearSave();
    S.team = [];
    S.crystals = { spark: 2, tide: 2, ember: 2, verdant: 2, terra: 2, gale: 2 };
    S.catalysts = 3; S.charge = 0;
    S.dex = new Set(); S.banked = {}; S.battle = null; S.breedPick = []; S.eggs = [];
    S.region = 'hollow_ridge'; S.seenBeats = [];
    S.view = 'start';
    render();
    return;
  }

  if (act === 'pick') {
    addMonster(G.createMonster({ speciesId: btn.dataset.id, level: 5, bond: 40 }));
    // Choosing a starter IS the opening beat, so mark it seen rather than
    // firing it later when the player happens to travel back here.
    S.seenBeats = ['hollow_ridge'];
    S.view = 'home';
  }

  else if (act === 'view') { S.view = btn.dataset.v; S.breedPick = []; }

  else if (act === 'rest') {
    S.team.forEach((m) => { m.hp = m.maxHp; m.status = null; });
    S.view = 'home';
  }

  else if (act === 'explore') {
    const party = S.team.filter((m) => m.hp > 0).slice(0, 3);
    // Wild levels track your strongest monster and never outrun it. Previously
    // they rolled 5-7 against a starter permanently stuck at 5.
    const wild = G.randomWild(rng, Math.max(...party.map((m) => m.level)), S.region);
    S.battle = G.createBattle(party, wild, rng);
    S.battle.log.push(`A wild ${wild.name} appears!`);
    S.view = 'battle';
  }

  else if (act === 'move') {
    const b = S.battle;
    const p = G.activeMonster(b);
    G.resolveTurn(b, p.moves[+btn.dataset.i]);
    afterTurn();
  }

  else if (act === 'attune') {
    S.attune = { taps: [], crystal: false, t: 0 };
    S.view = 'attune';
  }

  else if (act === 'crystal') {
    const e = S.battle.wild.elements[0];
    if (S.crystals[e] > 0) { S.crystals[e] -= 1; S.attune.crystal = true; }
  }

  else if (act === 'tap') doTap();

  else if (act === 'flee') { S.battle = null; S.view = 'home'; }

  else if (act === 'breedpick') {
    const uid = +btn.dataset.uid;
    const i = S.breedPick.indexOf(uid);
    if (i >= 0) S.breedPick.splice(i, 1);
    else { S.breedPick.push(uid); if (S.breedPick.length > 2) S.breedPick.shift(); }
  }

  else if (act === 'travel') {
    const r = G.regionById(btn.dataset.r);
    if (r && G.regionUnlocked(r, bestLevel())) {
      S.region = r.id;
      if (!S.seenBeats.includes(r.id)) {
        S.seenBeats.push(r.id);
        show(r.name, r.beat, null, true);
        render();
        return;
      }
      S.view = 'home';
    }
  }

  else if (act === 'breed') doBreed();

  else if (act === 'hatch') { doHatch(+btn.dataset.i); return; }

  else if (act === 'promote') {
    const uid = +btn.dataset.uid;
    const i = S.team.findIndex((m) => m.uid === uid);
    S.team.unshift(S.team.splice(i, 1)[0]);
  }

  render();
});

/** Award XP to everyone still standing, and report any level-ups. */
function awardXp(party, wildLevel) {
  const gained = [];
  party.forEach((m) => {
    if (m.hp <= 0) return;
    const before = m.level;
    const { levels } = G.grantXp(m, G.xpForWin(m.level, wildLevel));
    if (levels) {
      const learned = m.moves.filter((mv) => mv.learnAt > before && mv.learnAt <= m.level);
      gained.push(`${m.name} reached Lv ${m.level}` +
        (learned.length ? ` and learned ${learned.map((mv) => mv.name).join(' and ')}` : ''));
    }
  });
  return gained.length ? ' ' + gained.join('. ') + '.' : '';
}

/** Everyone recovers a chunk of HP after every encounter, win or lose. */
function healParty(fraction) {
  S.team.forEach((m) => {
    m.status = null;
    m.hp = Math.min(m.maxHp, Math.max(m.hp, 0) + Math.round(m.maxHp * fraction));
    if (m.hp <= 0) m.hp = Math.round(m.maxHp * fraction);
  });
}

function afterTurn() {
  const b = S.battle;
  if (!b.over) return;
  stopNeedle();
  if (b.outcome === 'wild_fainted') {
    const gain = 8 + Math.floor(rng() * 8);
    S.charge += gain;
    feedEggs(gain);
    b.team.forEach((m) => { if (m.hp > 0) m.bond = Math.min(100, m.bond + 2); });
    const e = b.wild.elements[0];
    S.crystals[e] += 1;
    const lv = awardXp(b.team, b.wild.level);
    S.battle = null;
    healParty(G.CONFIG.POST_BATTLE_HEAL);
    show('The wild Infinimon fled', `It escaped before you could attune. ` +
      `+${gain} Charge, +1 ${el(e).name} Crystal.` + lv, null, false);
  } else {
    S.team.forEach((m) => { m.bond = Math.max(0, m.bond - 5); });
    Object.keys(S.crystals).forEach((k) => { S.crystals[k] = Math.floor(S.crystals[k] / 2); });
    S.battle = null;
    // Recalled to the Lab means a full recovery — losing costs crystals, not time.
    S.team.forEach((m) => { m.hp = m.maxHp; m.status = null; });
    show('Recalled to the Lab', 'Your party is patched up. You lost half your crystals — nothing else.', null, false);
  }
}

const MAX_EGGS = 4;
// 18 base creatures + 18 same-element blends + 15 rare cross-element hybrids.
const DEX_TOTAL = G.SPECIES.length + Object.keys(G.BLENDS).length +
  Object.keys(G.HYBRID_PROFILES).length;

function doBreed() {
  const [a, b] = S.breedPick.map((uid) => S.team.find((m) => m.uid === uid));
  const res = G.breed(a, b, rng);
  if (res.error) { alert(res.error); return; }
  if (S.eggs.length >= MAX_EGGS) { alert('The chamber is full — hatch an egg first.'); return; }

  S.catalysts -= 1;
  S.breedPick = [];
  S.eggs.push(res.egg);

  // The egg keeps its result hidden until it hatches. Charge comes from
  // battling, so the reveal is earned rather than waited out.
  show('An egg!',
    `${a.name} and ${b.name} produced an egg. It needs ${res.egg.chargeNeeded} Charge ` +
    `to hatch — battle to build it up.`, null, true);
}

function doHatch(index) {
  const egg = S.eggs[index];
  if (!egg || !G.eggReady(egg)) return;
  S.eggs.splice(index, 1);
  addMonster(egg.child);

  const title = egg.rareBloom ? 'A Rare Bloom hatched!'
    : egg.kind === 'hybrid' ? 'The elements fused!'
    : egg.kind === 'blend' ? 'A new blend hatched'
    : 'The egg hatched';
  const body = egg.rareBloom ? 'Alternate palette and +10% to every stat.'
    : egg.kind === 'hybrid' ? `Against the odds, ${egg.parents.join(' and ')} produced a ` +
        `${egg.hybridElement}-element Infinimon. These are rare.`
    : egg.kind === 'blend' ? `${egg.parents.join(' and ')} combined into something new.`
    : `The resonance didn't hold — the egg carried a parent's line through instead.`;

  show(title, body, egg.child, true);
}

/** Every egg in the chamber gains Charge from a battle. */
function feedEggs(amount) {
  S.eggs.forEach((e) => G.feedEgg(e, amount));
}

// ---------------------------------------------------------------------------
// attunement minigame
// ---------------------------------------------------------------------------

let raf = null;

function zoneWidth() {
  return G.attuneZoneWidth(S.battle.wild, {
    crystalMatch: S.attune.crystal,
    tapsLanded: S.attune.taps.filter(Boolean).length,
  });
}

function placeZone() {
  const zone = document.getElementById('zone');
  if (!zone) return;
  const w = zoneWidth();
  // The zone is chosen once per attempt and then held. Widening it as taps land
  // keeps it anchored on the same centre so the target never jumps.
  if (S.attune.zoneCentre == null) S.attune.zoneCentre = 30 + rng() * 40;
  const start = Math.max(0, Math.min(100 - w, S.attune.zoneCentre - w / 2));
  S.attune.zoneStart = start;
  S.attune.zoneW = w;
  zone.style.left = start + '%';
  zone.style.width = w + '%';
}

function startNeedle() {
  stopNeedle();
  const needle = document.getElementById('needle');
  if (!needle) return;
  placeZone();

  let t = S.attune.t || 0;
  const step = () => {
    const speed = G.attuneSpeed(S.battle.wild, S.attune.taps.filter(Boolean).length);
    t += 0.016 * speed;
    // triangle wave, 0..1, so the needle sweeps back and forth
    const pos = Math.abs(((t % 2) + 2) % 2 - 1);
    S.attune.pos = pos * 100;
    S.attune.t = t;
    needle.style.left = S.attune.pos + '%';
    raf = requestAnimationFrame(step);
  };
  step();
}

function stopNeedle() { if (raf) cancelAnimationFrame(raf); raf = null; }

function doTap() {
  const a = S.attune;
  const hit = a.pos >= a.zoneStart && a.pos <= a.zoneStart + a.zoneW;
  a.taps.push(hit);

  if (a.taps.length < 3) {
    // The zone stays where it is and widens; the needle slows. Both curves run
    // in the player's favour as the creature settles.
    placeZone();
    render();
    return;
  }

  stopNeedle();
  const wild = S.battle.wild;
  const banked = S.banked[wild.speciesId] || 0;
  const result = G.attune(wild, {
    taps: a.taps.filter(Boolean).length,
    crystalMatch: a.crystal,
    banked,
  });
  S.banked[wild.speciesId] = result.newBanked;

  if (result.success) {
    wild.bond = 30;
    wild.hp = wild.maxHp;
    addMonster(wild);
    const gain = 8 + Math.floor(rng() * 8);
    S.charge += gain;
    feedEggs(gain);
    const lv = awardXp(S.battle.team, wild.level);
    S.battle = null;
    show(`${wild.name} joined you!`,
      `Trust ${result.trust} of ${result.required}. +${gain} Charge.` + lv, wild, true);
  } else {
    // Falling short no longer ends the encounter outright. You usually stay in
    // the fight with your Trust banked — but the creature's patience is finite,
    // so each failure risks it bolting. That keeps retries from making taming a
    // formality without ever wasting the progress you earned.
    S.attune = null;
    S.battle.attuneFails = (S.battle.attuneFails || 0) + 1;
    const bolts = rng() < G.fleeChanceAfterFailure(S.battle.attuneFails);

    if (bolts) {
      const gain = 4 + Math.floor(rng() * 5);
      S.charge += gain;
      feedEggs(gain);
      S.battle = null;
      healParty(G.CONFIG.POST_BATTLE_HEAL);
      show(`${wild.name} bolted`,
        `Trust reached ${result.trust} of ${result.required}. It got away — but next time ` +
        `you meet a ${wild.name} you start with +${result.newBanked} Trust. +${gain} Charge.`,
        null, false);
      return;
    }

    S.view = 'battle';
    S.battle.log.push(
      `Attunement reached ${result.trust} of ${result.required} Trust. ` +
      `${wild.name} is wary but still here — +${result.newBanked} Trust banked.`);
    G.resolveTurn(S.battle, null); // trying costs you the turn
    afterTurn();
  }
}

if (loadGame()) S.view = 'home';
render();
</script>
</body>
</html>
